<script>
'use strict';
const DATA=[{"id":"q11","chapter":"句子成分","page":6,"ref":"基础一·宾语1","q":"My brother hasn’t done his homework.","a":"his homework","why":"hasn’t done 是完整谓语；回答“做了什么”的是 his homework。","state":"核对","tag":"成分边界","note":"","task":"按题目要求，划出句中的宾语。","explanation":["句子说“我哥哥还没有做作业”。先找动作：hasn’t done是“还没有做”，然后问“没做什么？”答案是his homework，所以这整个名词短语是宾语。","hasn’t不是单独一个完整的动作表达，它与done组成现在完成时的否定形式。划宾语时不要把done划进去，也不要漏掉his。"],"related":[{"id":"q12","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"},{"id":"q13","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"},{"id":"q14","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"}]},{"id":"q12","chapter":"句子成分","page":6,"ref":"基础一·宾语2","q":"People all over the world speak English.","a":"English","why":"all over the world 修饰 people；speak 后的 English 是宾语。","state":"核对","tag":"成分边界","note":"","task":"按题目要求，划出句中的宾语。","explanation":["先把修饰人的all over the world暂时括起来，主干就是People speak English：人们说英语。English回答“说什么”，所以是宾语。","all over the world说明是哪些people，属于主语内部的修饰；它没有改变speak与English之间的动宾关系。"],"related":[{"id":"q11","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"},{"id":"q13","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"},{"id":"q14","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"}]},{"id":"q13","chapter":"句子成分","page":6,"ref":"基础一·宾语3","q":"How many new words did you learn last class?","a":"How many new words","why":"还原为 You learned how many new words。宾语虽移到句首，仍是完整名词短语，不能只划 words。","state":"核对","tag":"成分边界","note":"","task":"按题目要求，划出句中的宾语。","explanation":["这是一道问句，问“上节课你学了多少新单词”。把疑问语序暂时还原为You learned how many new words last class，就能看见learned后面所学的内容。","How many new words虽然移到了句首，仍整体作宾语。how many与new都属于这一名词短语，不能只划words；did只是帮助构成问句。"],"related":[{"id":"q11","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"},{"id":"q12","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"},{"id":"q14","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"}]},{"id":"q14","chapter":"句子成分","page":6,"ref":"基础一·宾语4","q":"Some of the students in the school want to go swimming, how about you?","a":"want 的宾语：to go swimming","why":"不能只划 swimming；go swimming 是活动表达。原句逗号后另起问句，规范可写 “…want to go swimming. How about you?”","state":"需修正","tag":"成分边界","note":"照片只划了 swimming，范围不足。","task":"按题目要求，划出句中的宾语。","explanation":["先问学生们“想要什么”：不是单独“游泳”这个词，而是“去游泳”这整件事，因此want后面的to go swimming整体作宾语。","go swimming是“去游泳”的活动表达。swimming依附于go，to go swimming又依附于want，划成分要按外层动词want来确定范围。"],"related":[{"id":"q19","reason":"对比不定式和从句：to do在这几句中接在want、forget、begin之后，不能仅凭形式把它判成定语或状语。"},{"id":"q28","reason":"对比不定式和从句：to do在这几句中接在want、forget、begin之后，不能仅凭形式把它判成定语或状语。"},{"id":"q11","reason":"同为划宾语：动词作用于什么？注意疑问句中的宾语会移到句首，不定式也可以整体作宾语。"}]},{"id":"q15","chapter":"句子成分","page":6,"ref":"基础一·表语1","q":"The old man was feeling very tired.","a":"very tired","why":"was feeling 是系动词 feel 的过去进行形式；very tired 整体说明主语状态。不能把 feeling 一起划入表语。","state":"需修正","tag":"成分边界","note":"照片把 feeling very tired 整段划出，混入了系动词。","task":"按题目要求，划出句中的表语。","explanation":["这句话的意思是“老人当时觉得很累”。was feeling整体表示当时的感受；very tired说明老人处于什么状态，所以它才是表语。","表语就是跟在系动词后、说明主语身份或状态的部分。此处feel表示“感觉”，是系动词；was是过去进行时的助动词，不能把feeling划进表语。"],"related":[{"id":"q16","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"},{"id":"q17","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"},{"id":"q64","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"}]},{"id":"q16","chapter":"句子成分","page":6,"ref":"基础一·表语2","q":"The leaves have turned yellow.","a":"yellow","why":"have turned 表示已经变得，yellow 说明变化后的状态。","state":"正确","tag":"成分边界","note":"可见划线为 yellow。","task":"按题目要求，划出句中的表语。","explanation":["句子说“叶子已经变黄了”。have turned是“已经变得”，yellow说明变成了什么状态，所以yellow作表语。","turned不是因为长得像过去分词就单独算表语；它与have构成动词部分。真正描述leaves状态的是yellow。"],"related":[{"id":"q15","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"},{"id":"q17","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"},{"id":"q64","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"}]},{"id":"q17","chapter":"句子成分","page":6,"ref":"基础一·表语3","q":"Soon they all became interested in the subject.","a":"interested in the subject","why":"核心词 interested，完整表语短语为 interested in the subject。became 是系动词，Soon 是时间状语。","state":"核对","tag":"成分边界","note":"只划 interested 时需区分“核心词”与“完整成分”。","task":"按题目要求，划出句中的表语。","explanation":["先找变化：became表示“变得”。变成什么状态？interested in the subject，意为“对这门学科感兴趣”，这个整体是表语。","interested是核心词，in the subject补充“对什么感兴趣”。若题目要求划完整成分，应一起划出；Soon只说明变化发生的时间。"],"related":[{"id":"q15","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"},{"id":"q16","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"},{"id":"q64","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"}]},{"id":"q18","chapter":"句子成分","page":6,"ref":"基础一·定语1","q":"What is your given name?","a":"your；given（均修饰 name）","why":"given name 指名字；your 限定归属，given 修饰 name。若题目只要求修饰性定语，核心是 given。","state":"核对","tag":"成分边界","note":"","task":"按题目要求，划出句中的定语。","explanation":["given name 指名字；your 限定归属，given 修饰 name。","若题目只要求修饰性定语，核心是 given。"],"related":[{"id":"q20","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"},{"id":"q21","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"},{"id":"q29","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"}]},{"id":"q19","chapter":"句子成分","page":6,"ref":"基础一·定语2","q":"I am afraid some people forgot to sweep the floor.","a":"some（修饰 people）","why":"to sweep the floor 是 forgot 的宾语，不是定语；am afraid 后接省略 that 的从句。","state":"需修正","tag":"宾语与定语","note":"照片把 to sweep the floor 划作定语。","task":"按题目要求，划出句中的定语。","explanation":["这题要求找定语，不是找句中最长的短语。some people中的some限定“哪些/多少人”，因此是people前的限定成分，按本卷归入定语。","forgot to sweep the floor是“忘了扫地”，to sweep the floor回答“忘了什么事”，依附于forgot作宾语，而不是修饰某个名词的定语。"],"related":[{"id":"q14","reason":"对比不定式和从句：to do在这几句中接在want、forget、begin之后，不能仅凭形式把它判成定语或状语。"},{"id":"q28","reason":"对比不定式和从句：to do在这几句中接在want、forget、begin之后，不能仅凭形式把它判成定语或状语。"}]},{"id":"q20","chapter":"句子成分","page":6,"ref":"基础一·定语3","q":"The man downstairs was trying to sleep.","a":"downstairs","why":"副词 downstairs 后置修饰 man；不是一看副词就认定为状语。","state":"正确","tag":"形式与功能","note":"可见划线为 downstairs。","task":"按题目要求，划出句中的定语。","explanation":["句子谈的是“楼下的那个人”。downstairs紧跟man，用来区分是哪个人，因此修饰man，是后置定语。","不要根据downstairs是副词就直接答状语。成分取决于它在这句话里修饰谁；was trying to sleep才是这个人的动作。"],"related":[{"id":"q18","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"},{"id":"q21","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"},{"id":"q29","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"}]},{"id":"q21","chapter":"句子成分","page":6,"ref":"基础一·定语4","q":"I am waiting for the sound of the other shoe!","a":"of the other shoe 修饰 sound；other 在内部修饰 shoe。","why":"要分层看：sound 后接介词短语定语；介词短语内部仍可有定语。","state":"需修正","tag":"成分边界","note":"照片只划 the other，漏了修饰 sound 的完整短语。","task":"按题目要求，划出句中的定语。","explanation":["I am waiting for the sound说明“我在等那个声音”。哪一种声音？of the other shoe，即另一只鞋发出的声音，因此这整个介词短语修饰sound。","the other shoe在介词短语内部，other又修饰shoe。只划the other，就把内层词语与外层要找的完整定语混淆了。"],"related":[{"id":"q18","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"},{"id":"q20","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"},{"id":"q29","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"}]},{"id":"q22","chapter":"句子成分","page":6,"ref":"基础一·宾补1","q":"She likes the children to read newspapers and books in the reading-room.","a":"to read newspapers and books in the reading-room","why":"在此句式中，the children 是宾语，不定式说明希望孩子做什么。短语内 newspapers and books 是 read 的宾语。","state":"核对","tag":"宾语与补语","note":"原句表达不如 would like 自然，但可据 likes sb to do 分析。","task":"按题目要求，划出句中的宾补。","explanation":["先看“她希望谁做什么”：the children是她所指的孩子，to read…说明孩子要做的事。因此children作宾语，后面的不定式短语作宾补。","newspapers and books是read的宾语，属于宾补短语内部，不能拿它们替代整句likes后面的宾语。原句用would like会更常见，本题按现有句式分析。"],"related":[{"id":"q23","reason":"相同结构：动词＋人＋to do。人是宾语，to do说明这个人要做的事，是宾语补足语。"},{"id":"q66","reason":"相同结构：动词＋人＋to do。人是宾语，to do说明这个人要做的事，是宾语补足语。"}]},{"id":"q23","chapter":"句子成分","page":6,"ref":"基础一·宾补2","q":"He asked her to take the boy out of school.","a":"to take the boy out of school","why":"ask sb to do sth；her 是宾语，后面的不定式是宾补。","state":"正确","tag":"宾语与补语","note":"划线范围与题意一致。","task":"按题目要求，划出句中的宾补。","explanation":["ask her是“要求她”，要求她做什么？to take the boy out of school。这一不定式说明her要做的动作，所以作宾语补足语。","her才是asked的宾语。the boy虽然也是一个人，但它是take的宾语，处在内层短语中，不是asked的第二个宾语。"],"related":[{"id":"q22","reason":"相同结构：动词＋人＋to do。人是宾语，to do说明这个人要做的事，是宾语补足语。"},{"id":"q66","reason":"相同结构：动词＋人＋to do。人是宾语，to do说明这个人要做的事，是宾语补足语。"}]},{"id":"q24","chapter":"句子成分","page":6,"ref":"基础一·宾补3","q":"She found it difficult to do the work.","a":"difficult","why":"it 是形式宾语，to do the work 是真正宾语；difficult 才是宾补。可理解为 She found doing the work difficult。","state":"需修正","tag":"形式宾语","note":"照片划的是 to do the work，混淆真正宾语和宾补。","task":"按题目要求，划出句中的宾补。","explanation":["句子意思是“她发现做这项工作很难”。真正被评价的事情是to do the work，“难”是对这件事的评价，所以difficult是宾补。","句子先用it占住宾语的位置，把较长的to do the work放到后面：found＋it＋difficult＋to do the work。it叫形式宾语，后面的不定式是真正宾语。","不能把to do the work划为宾补：它回答“什么事很难”，不是回答“这件事怎么样”。"],"related":[{"id":"q47","reason":"对比形式主语与形式宾语：it先占位置，真正内容在后面；但题目若问宾补，答案不是后面的to do。"},{"id":"q55","reason":"对比形式主语与形式宾语：it先占位置，真正内容在后面；但题目若问宾补，答案不是后面的to do。"},{"id":"q25","reason":"对比宾补与双宾语：difficult、Lily、different说明宾语；people和message则分别是接受者与传递的内容。"}]},{"id":"q25","chapter":"句子成分","page":6,"ref":"基础一·宾补4","q":"They call me Lily sometimes.","a":"Lily","why":"me 与 Lily 指同一人，Lily 给 me 命名；不是两个宾语。sometimes 是状语。","state":"正确","tag":"宾语与补语","note":"可见划线为 Lily。","task":"按题目要求，划出句中的宾补。","explanation":["They call me Lily意为“他们叫我Lily”。me与Lily指同一个人，Lily补充说明me叫什么，因此是宾补。","双宾语通常是“给谁、给什么”，两个宾语不是同一身份；这里不是“给我一个Lily”。sometimes只说明频率。"],"related":[{"id":"q199","reason":"对照表语与命名补语：girl在be后表示身份，Lily说明me是谁；都不是动作承受的普通宾语。"},{"id":"q24","reason":"对比宾补与双宾语：difficult、Lily、different说明宾语；people和message则分别是接受者与传递的内容。"},{"id":"q58","reason":"对比宾补与双宾语：difficult、Lily、different说明宾语；people和message则分别是接受者与传递的内容。"}]},{"id":"q26","chapter":"句子成分","page":6,"ref":"基础一·状语1","q":"There was a big smile on her face.","a":"on her face（按讲义的地点状语分析）","why":"存在句表示何处有某物；也有分析把该介词短语并入 smile 的后置修饰语，本讲义按地点状语处理。","state":"有歧义","tag":"成分边界","note":"不要把此题当成唯一语法分析体系的判别题。","task":"按题目要求，划出句中的状语。","explanation":["存在句表示何处有某物；也有分析把该介词短语并入 smile 的后置修饰语，本讲义按地点状语处理。"],"related":[{"id":"q27","reason":"这两句都存在介词或地点成分的依附歧义，应结合语境说明，不宜机械只认一种划线。"}]},{"id":"q27","chapter":"句子成分","page":6,"ref":"基础一·状语2","q":"Every night he heard the noise upstairs.","a":"Every night；upstairs 的依附关系需结合语境。","why":"Every night 明确是时间状语。upstairs 可描述听到声音的位置，也可后置修饰 noise（楼上的噪声）；孤立句存在歧义。","state":"有歧义","tag":"成分边界","note":"不能据 upstairs 的单一划法判定掌握程度。","task":"按题目要求，划出句中的状语。","explanation":["Every night 明确是时间状语。","upstairs 可描述听到声音的位置，也可后置修饰 noise（楼上的噪声）；孤立句存在歧义。"],"related":[{"id":"q26","reason":"这两句都存在介词或地点成分的依附歧义，应结合语境说明，不宜机械只认一种划线。"}]},{"id":"q28","chapter":"句子成分","page":6,"ref":"基础一·状语3","q":"He began to learn English when he was eleven.","a":"when he was eleven","why":"时间状语从句修饰 began to learn；to learn English 是 began 的宾语。","state":"核对","tag":"短语与从句","note":"","task":"按题目要求，划出句中的状语。","explanation":["“他在十一岁时开始学英语。”when he was eleven回答“什么时候开始”，所以是时间状语从句。","它内部有自己的主语he、系动词was和表语eleven，因而叫从句。to learn English虽也含动词，却是不定式短语，作began的宾语。"],"related":[{"id":"q14","reason":"对比不定式和从句：to do在这几句中接在want、forget、begin之后，不能仅凭形式把它判成定语或状语。"},{"id":"q19","reason":"对比不定式和从句：to do在这几句中接在want、forget、begin之后，不能仅凭形式把它判成定语或状语。"},{"id":"q31","reason":"都含状语从句：when补充时间，as在对应句中补充原因；先分清主句和从句。"}]},{"id":"q29","chapter":"句子成分","page":6,"ref":"基础一·状语4","q":"The man on the motorbike was traveling too fast.","a":"too fast","why":"on the motorbike 修饰 man，是定语；too fast 修饰 was traveling，是状语。","state":"正确","tag":"成分边界","note":"可见划线为 too fast。","task":"按题目要求，划出句中的状语。","explanation":["先看两处修饰分别回答什么：on the motorbike回答“哪个男人”，修饰man；too fast回答“骑得/行进得怎样”，修饰was traveling。","因此前者是定语，后者是题目要找的状语。不能因为两处都在补充信息就划成同一种成分。"],"related":[{"id":"q18","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"},{"id":"q20","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"},{"id":"q21","reason":"对比定语与状语：看它修饰名词还是动作，而不是只看它是副词还是介词短语。"}]},{"id":"q30","chapter":"句子成分","page":6,"ref":"基础二·划分1","q":"You will tell your friend that you’ve got to school.","a":"You 主语；will tell 谓语；your friend 间接宾语；that…school 直接宾语从句。","why":"tell sb sth：两项宾语。“你已到校”是告知的内容；从句内 you 是主语，have got 是谓语，to school 是地点/方向成分。","state":"核对","tag":"宾语从句","note":"原文 you’ve got to school 按“已经到校”理解，不误解为 have got to do。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["先读主句：You will tell your friend…，意思是“你会告诉朋友……”。your friend是接收信息的人，that you’ve got to school是要告诉他的内容，分别为间接宾语、直接宾语。","后面的内容本身是一句“你已经到校了”，因此整体叫宾语从句。不要把其中的you或school当作主句的宾语来单独划。"],"related":[{"id":"q42","reason":"都是给某人传达内容：that从句、how to do短语、名词message形式不同，不能见两个动词就认定是复合句。"},{"id":"q69","reason":"都是给某人传达内容：that从句、how to do短语、名词message形式不同，不能见两个动词就认定是复合句。"}]},{"id":"q31","chapter":"句子成分","page":7,"ref":"基础二·划分2","q":"But as the moon gave far too much light, I didn’t dare open a window.","a":"主句：I／didn’t dare open／a window；as 从句作原因状语。","why":"从句内 the moon 是主语，gave 是谓语，far too much light 是宾语。But 是衔接上文的连词，不属于主语。","state":"核对","tag":"主从层级","note":"","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["从句内 the moon 是主语，gave 是谓语，far too much light 是宾语。","But 是衔接上文的连词，不属于主语。"],"related":[{"id":"q28","reason":"都含状语从句：when补充时间，as在对应句中补充原因；先分清主句和从句。"},{"id":"q39","reason":"都含状语从句：when补充时间，as在对应句中补充原因；先分清主句和从句。"}]},{"id":"q32","chapter":"句子成分","page":7,"ref":"基础二·划分3","q":"Another time five months ago, I happened to be upstairs at dusk when the window was open.","a":"I 主语；happened to be 表示“碰巧处于”；upstairs 地点成分；Another time five months ago、at dusk、when…open 为时间信息。","why":"when 从句内部 window 主语、was 系动词、open 表语。happened to be 不要拆成互不相关的两个谓语；upstairs 在不同学校分析体系中可列作 be 的表语。","state":"有歧义","tag":"主从层级","note":"明确层级即可，不据“表语/地点成分”的体系差异判错。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["when 从句内部 window 主语、was 系动词、open 表语。","happened to be 不要拆成互不相关的两个谓语；upstairs 在不同学校分析体系中可列作 be 的表语。"],"related":[{"id":"q45","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"},{"id":"q51","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"},{"id":"q53","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"}]},{"id":"q33","chapter":"句子成分","page":7,"ref":"基础二·划分4","q":"The dark, rainy evening, the wind, and the thundering clouds held me entirely in their power.","a":"并列主语：evening、wind、clouds 三个名词短语；held 谓语；me 宾语；entirely 状语；in their power 为宾语的状态补足成分。","why":"“把我控制在它们力量之下”可还原 me in their power。dark / rainy / thundering 在名词短语内作定语。","state":"核对","tag":"成分层级","note":"不能只划 evening、wind 而漏掉主语中的修饰语。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["“把我控制在它们力量之下”可还原 me in their power。","dark / rainy / thundering 在名词短语内作定语。"],"related":[{"id":"q52","reason":"长修饰语会遮住主干；先找整句主语与谓语，再回看名词内部的修饰成分。"},{"id":"q62","reason":"长修饰语会遮住主干；先找整句主语与谓语，再回看名词内部的修饰成分。"}]},{"id":"q34","chapter":"句子成分","page":7,"ref":"基础三·句型1","q":"We often study Chinese history on Friday afternoon.","a":"简单句","why":"只有一个限定谓语 study；时间状语不会增加分句。","state":"正确","tag":"句型","note":"照片标“简”。","task":"判断是简单句、并列句还是主从复合句。","explanation":["只有一个限定谓语 study；时间状语不会增加分句。"],"related":[{"id":"q36","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"},{"id":"q37","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"},{"id":"q43","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"}]},{"id":"q35","chapter":"句子成分","page":7,"ref":"基础三·句型2","q":"The boy who offered me his seat is called Tom.","a":"复合句","why":"主句谓语 is called；who offered… 是修饰 boy 的定语从句。","state":"正确","tag":"句型","note":"照片标“复”。","task":"判断是简单句、并列句还是主从复合句。","explanation":["把who offered me his seat暂时括起来，主句就是The boy is called Tom。括起的部分解释是“给我让座的那个男孩”。","主句有is called，从句内部还有who offered…，两个层级由who连接，因此是主从复合句；不是仅仅因为看见两个动词就判定。"],"related":[{"id":"q41","reason":"这些句子含从句，但位置不同：修饰名词、作主语或作让步状语，要在原句中找边界。"},{"id":"q54","reason":"这些句子含从句，但位置不同：修饰名词、作主语或作让步状语，要在原句中找边界。"},{"id":"q70","reason":"这些句子含从句，但位置不同：修饰名词、作主语或作让步状语，要在原句中找边界。"}]},{"id":"q36","chapter":"句子成分","page":7,"ref":"基础三·句型3","q":"There is a chair in this room, isn’t there?","a":"简单句＋附加问句（按本练习分类选简单句）","why":"附加问句不按普通并列分句计入该题的三分类。","state":"正确","tag":"句型","note":"照片标“简”。","task":"判断是简单句、并列句还是主从复合句。","explanation":["附加问句不按普通并列分句计入该题的三分类。"],"related":[{"id":"q34","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"},{"id":"q37","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"},{"id":"q43","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"}]},{"id":"q37","chapter":"句子成分","page":7,"ref":"基础三·句型4","q":"My brother and I go to school at half past seven in the morning and come back home at seven in the evening.","a":"简单句","why":"My brother and I 是并列主语；go 与 come back 是同一主语下的并列谓语，没有新从句。","state":"需修正","tag":"句型","note":"照片标“复”。不能凭两个 and 判为复合句。","task":"判断是简单句、并列句还是主从复合句。","explanation":["My brother and I是两个人组成的同一个主语，后面go to school与come back home是这个主语做的两个动作。","两个and分别连接主语中的人和谓语中的动作，没有引出新的从句，所以按本卷分类是简单句。简单句可以含并列主语、并列谓语，不等于只能有一个人或一个动作。"],"related":[{"id":"q34","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"},{"id":"q36","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"},{"id":"q43","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"}]},{"id":"q38","chapter":"句子成分","page":7,"ref":"基础三·句型5","q":"He is in class one and I am in class two.","a":"并列句","why":"and 连接 He is… 和 I am… 两个完整分句。","state":"正确","tag":"句型","note":"照片标“并”。","task":"判断是简单句、并列句还是主从复合句。","explanation":["and前是He is in class one，后是I am in class two。两边各自都有主语和谓语，单独拿出来也都是完整句子。","因此这里and连接的是两个分句，全句是并列句；与同一主语后连接go和come back不同。"],"related":[{"id":"q37","reason":"对比and、nor连接的层级：连接词或同一主语下的动作，与连接两个完整分句不同。"},{"id":"q40","reason":"对比and、nor连接的层级：连接词或同一主语下的动作，与连接两个完整分句不同。"},{"id":"q43","reason":"对比and、nor连接的层级：连接词或同一主语下的动作，与连接两个完整分句不同。"}]},{"id":"q39","chapter":"句子成分","page":7,"ref":"基础三·句型6","q":"He was fond of drawing when he was yet a child.","a":"复合句","why":"when 引导时间状语从句。drawing 是动名词，不是独立谓语。","state":"正确","tag":"句型","note":"照片标“复”。","task":"判断是简单句、并列句还是主从复合句。","explanation":["when 引导时间状语从句。","drawing 是动名词，不是独立谓语。"],"related":[{"id":"q28","reason":"都含状语从句：when补充时间，as在对应句中补充原因；先分清主句和从句。"},{"id":"q31","reason":"都含状语从句：when补充时间，as在对应句中补充原因；先分清主句和从句。"}]},{"id":"q40","chapter":"句子成分","page":7,"ref":"基础三·句型7","q":"Neither has he changed his mind, nor will he do so.","a":"并列句","why":"neither…nor 连接两个分句，否定词前置触发部分倒装。","state":"正确","tag":"句型","note":"照片标“并”。","task":"判断是简单句、并列句还是主从复合句。","explanation":["neither…nor 连接两个分句，否定词前置触发部分倒装。"],"related":[{"id":"q37","reason":"对比and、nor连接的层级：连接词或同一主语下的动作，与连接两个完整分句不同。"},{"id":"q38","reason":"对比and、nor连接的层级：连接词或同一主语下的动作，与连接两个完整分句不同。"},{"id":"q43","reason":"对比and、nor连接的层级：连接词或同一主语下的动作，与连接两个完整分句不同。"}]},{"id":"q41","chapter":"句子成分","page":7,"ref":"基础三·句型8","q":"What he said at the meeting is very important, isn’t it?","a":"复合句","why":"What he said… 整体是主语从句；主句谓语 is。","state":"正确","tag":"句型","note":"照片标“复”。","task":"判断是简单句、并列句还是主从复合句。","explanation":["先问“什么很重要”：What he said at the meeting，即他在会上说的话。这个部分整体放在is前面，作主语。","主语内部又有he said这样的主谓结构，所以是主语从句，全句为复合句。句末isn’t it是附加问句，不改变前面的主从层级。"],"related":[{"id":"q35","reason":"这些句子含从句，但位置不同：修饰名词、作主语或作让步状语，要在原句中找边界。"},{"id":"q54","reason":"这些句子含从句，但位置不同：修饰名词、作主语或作让步状语，要在原句中找边界。"},{"id":"q70","reason":"这些句子含从句，但位置不同：修饰名词、作主语或作让步状语，要在原句中找边界。"}]},{"id":"q42","chapter":"句子成分","page":7,"ref":"基础三·句型9","q":"The farmer is showing the boy how to plant a tree.","a":"简单句","why":"how to plant a tree 是“疑问词＋不定式”，不是有独立限定谓语的从句；整体作所展示的内容。","state":"需修正","tag":"短语与从句","note":"照片标“复”；需与 how he can plant a tree 对比。","task":"判断是简单句、并列句还是主从复合句。","explanation":["主句是The farmer is showing the boy…，农民正在向男孩展示某个方法；方法就是how to plant a tree（怎样种树）。","how后面是to plant，不是“某个主语＋有时态的谓语”。所以how to plant a tree是疑问词＋不定式短语，不是从句，全句仍是简单句。"],"related":[{"id":"q30","reason":"都是给某人传达内容：that从句、how to do短语、名词message形式不同，不能见两个动词就认定是复合句。"},{"id":"q69","reason":"都是给某人传达内容：that从句、how to do短语、名词message形式不同，不能见两个动词就认定是复合句。"}]},{"id":"q43","chapter":"句子成分","page":7,"ref":"基础三·句型10","q":"Both Tom and Jack enjoy country music.","a":"简单句","why":"both…and 只连接主语 Tom 和 Jack；全句一个谓语 enjoy。","state":"正确","tag":"句型","note":"照片标“简”。","task":"判断是简单句、并列句还是主从复合句。","explanation":["both…and 只连接主语 Tom 和 Jack；全句一个谓语 enjoy。"],"related":[{"id":"q34","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"},{"id":"q36","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"},{"id":"q37","reason":"同属本练习中的简单句：主语并列、谓语并列或附加问句，不等于出现主从复合结构。"}]},{"id":"q44","chapter":"句子成分","page":7,"ref":"进阶一·1","q":"The development of science and technology has made great influence on people’s daily life and work.","a":"主语 The development of science and technology；谓语 has made；宾语 great influence；on… 是 influence 的补足修饰成分，通常随名词短语分析。","why":"主语中心词是 development，不是 technology。原句搭配不地道，标准表达建议 has had a great influence on…。不把原文搭配问题算到学生头上。","state":"有歧义","tag":"原题质量","note":"原题 make influence 及介词短语划法不宜机械评分。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["主语中心词是 development，不是 technology。","原句搭配不地道，标准表达建议 has had a great influence on…。","不把原文搭配问题算到学生头上。"],"related":[{"id":"q60","reason":"这些原题的搭配或语义有问题。只分析可确定的主干，原题的问题不归因于学生。"},{"id":"q61","reason":"这些原题的搭配或语义有问题。只分析可确定的主干，原题的问题不归因于学生。"}]},{"id":"q45","chapter":"句子成分","page":7,"ref":"进阶一·2","q":"That is why the people all over the world are making great efforts to keep the natural balance.","a":"That 主语；is 系动词；why…balance 整体为表语从句。","why":"从句内 people 主语、are making 谓语、great efforts 宾语。to keep… 表目的/补足 efforts 的内容，不是“宾语会保持平衡”的宾补。","state":"需修正","tag":"主从层级","note":"照片把 to keep… 标“宾补”；更重要的是补标整个 why 从句的表语功能。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["从句内 people 主语、are making 谓语、great efforts 宾语。","to keep… 表目的/补足 efforts 的内容，不是“宾语会保持平衡”的宾补。"],"related":[{"id":"q32","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"},{"id":"q51","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"},{"id":"q53","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"}]},{"id":"q46","chapter":"句子成分","page":8,"ref":"进阶一·3","q":"Effective measures can be taken to make communication easier between people from different cultures.","a":"主语 Effective measures；谓语 can be taken；目的状语 to make…cultures。","why":"不定式内部 communication 是 make 的宾语，easier 是宾补；between… 修饰交流范围；from different cultures 修饰 people。目的不定式不是被动谓语 taken 的直接宾语。","state":"需修正","tag":"主从层级","note":"照片把 to make… 整段标作宾语。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["句子主干是Effective measures can be taken：可以采取有效措施。措施是被采取的，can be taken要完整保留。","to make communication easier回答“采取措施为了什么”，整体是目的状语。在它内部，communication是make的宾语，easier说明communication会变得怎样，是宾补。","外层的目的状语内部仍能有宾语和宾补，不能把这两个层次混为一谈。"],"related":[{"id":"q49","reason":"对比补足语的位置：主动句补充宾语，被动后可能补充主语；还要区分外层句子与短语内部。"},{"id":"q53","reason":"对比补足语的位置：主动句补充宾语，被动后可能补充主语；还要区分外层句子与短语内部。"},{"id":"q58","reason":"对比补足语的位置：主动句补充宾语，被动后可能补充主语；还要区分外层句子与短语内部。"}]},{"id":"q47","chapter":"句子成分","page":8,"ref":"进阶一·4","q":"It occurred to Jack, the English monitor that he had forgotten to take his English textbook with me.","a":"It 形式主语；occurred 谓语；to Jack 介词短语；the English monitor 同位语；that… 真正主语从句。","why":"It occurs to sb that… 表“某人想到……”。that 从句不修饰 monitor，因此不是定语从句。原句建议在 monitor 后补逗号，并核实 with me 是否应为 with him。","state":"需修正","tag":"形式主语","note":"照片把 that… 标定语；原讲义标点和代词也有瑕疵。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["It occurred to Jack that…表示“Jack突然想到……”。想到的完整内容是that he had forgotten…；句首it只是先占住主语位置。","the English monitor补充说明Jack的身份，是同位语；that从句并不是描述“什么样的班长”，所以不是修饰monitor的定语从句。原题monitor后少一个用于结束同位语的逗号，with me的人称也需核对。"],"related":[{"id":"q55","reason":"对比形式主语与形式宾语：it先占位置，真正内容在后面；但题目若问宾补，答案不是后面的to do。"},{"id":"q24","reason":"对比形式主语与形式宾语：it先占位置，真正内容在后面；但题目若问宾补，答案不是后面的to do。"}]},{"id":"q48","chapter":"句子成分","page":8,"ref":"进阶一·5","q":"I must make full use of the limited time left to me and do as much as I can for the living people.","a":"I 主语；must make…与（must）do… 为并列谓语结构；left to me 是 time 的后置定语。","why":"make full use of 是固定搭配；as much as I can 表可做到的事情/数量；for the living people 表受益对象，不是宾补。","state":"需修正","tag":"宾语与补语","note":"照片将 for the living people 标“宾补”；应重新判断逻辑关系。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["make full use of 是固定搭配；as much as I can 表可做到的事情/数量；for the living people 表受益对象，不是宾补。"],"related":[{"id":"q59","reason":"都要完整识别谓语：助动词与实义动词合看；and可能连接同一主语下的两个动作。"},{"id":"q62","reason":"都要完整识别谓语：助动词与实义动词合看；and可能连接同一主语下的两个动作。"}]},{"id":"q49","chapter":"句子成分","page":8,"ref":"进阶一·6","q":"The boy, who was just released from the prison life, was caught stealing again.","a":"The boy 主语；who…life 定语从句；was caught 谓语；stealing 主语补足成分；again 状语。","why":"主动形式是 someone caught the boy stealing；变被动后 stealing 补充主语 boy，不再是主句宾语。原文 prison life 表达生硬，不作为写作范例。","state":"需修正","tag":"主动被动","note":"照片把 stealing 作为宾语，需结合被动结构重看。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["把被动句还原为Someone caught the boy stealing：有人抓到男孩正在偷东西。stealing说明男孩当时在做什么。","变成The boy was caught stealing后，boy已经成为主语，stealing也随之补充主语的动作，不能仍把它称作主句宾语。who…只是修饰boy的定语从句。"],"related":[{"id":"q46","reason":"对比补足语的位置：主动句补充宾语，被动后可能补充主语；还要区分外层句子与短语内部。"},{"id":"q53","reason":"对比补足语的位置：主动句补充宾语，被动后可能补充主语；还要区分外层句子与短语内部。"},{"id":"q58","reason":"对比补足语的位置：主动句补充宾语，被动后可能补充主语；还要区分外层句子与短语内部。"}]},{"id":"q50","chapter":"句子成分","page":8,"ref":"进阶一·7","q":"He was interested in creating a picture of the world, a digital time capsule for the future.","a":"He 主语；was 系动词；interested in creating… 表语；a digital time capsule… 为 a picture… 的同位语。","why":"介词 in 后 creating… 是动名词短语；同位语用另一个名词短语解释同一事物，不是宾补。","state":"需修正","tag":"同位语","note":"照片把 a digital time capsule… 标“宾补”。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["先找主干He was interested in…，表示他对某件事感兴趣。介词in后面接creating a picture…这件事，creating在这里不是独立谓语。","后面的a digital time capsule for the future是对a picture of the world的另一种说法，两者指同一作品，所以是同位语；它不是对He的状态补充。"],"related":[{"id":"q63","reason":"都带有插入或解释信息：同位语解释名词，as插入语补充评论，不能把它们混为主句谓语。"}]},{"id":"q51","chapter":"句子成分","page":8,"ref":"进阶一·8","q":"On this theory, narcissism becomes a problem only when certain early experiences, like a lack of parental empathy, make you cling to the centre-of-the-universe fantasy into her life.","a":"主句 narcissism / becomes / a problem；On this theory 状语；only when… 时间/条件状语从句。","why":"从句内 experiences 主语、make 谓语、you 宾语、cling… 宾补。like a lack… 举例说明 experiences。原句 you 与 her 等表达衔接异常，末尾不作可靠精细判分依据。","state":"有歧义","tag":"主从层级","note":"保留原句，不静默改写有问题的材料。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["从句内 experiences 主语、make 谓语、you 宾语、cling… 宾补。","like a lack… 举例说明 experiences。","原句 you 与 her 等表达衔接异常，末尾不作可靠精细判分依据。"],"related":[{"id":"q32","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"},{"id":"q45","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"},{"id":"q53","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"}]},{"id":"q52","chapter":"句子成分","page":8,"ref":"进阶一·9","q":"And with the high amount of people who come unprepared for such an active hike, Norway’s leading hiking group Friluftsliv, also has called for regulations on the number of tourists hiking to Trolltunga.","a":"主语 Norway’s leading hiking group Friluftsliv；谓语 has called for；regulations 宾语；句首 with… 作背景/原因状语。","why":"who… 修饰 people；on the number… 修饰 regulations；hiking to Trolltunga 修饰 tourists。主语后的逗号不规范，amount of people 宜改 number of people。","state":"需修正","tag":"成分层级","note":"照片把句首 people 当主语，末尾 on… 当状语；先抓主句 has called for。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["who… 修饰 people；on the number… 修饰 regulations；hiking to Trolltunga 修饰 tourists。","主语后的逗号不规范，amount of people 宜改 number of people。"],"related":[{"id":"q33","reason":"长修饰语会遮住主干；先找整句主语与谓语，再回看名词内部的修饰成分。"},{"id":"q62","reason":"长修饰语会遮住主干；先找整句主语与谓语，再回看名词内部的修饰成分。"}]},{"id":"q53","chapter":"句子成分","page":8,"ref":"进阶一·10","q":"When the person using the fork starts to slurp, the fork sends a signal to the person’s phone, making it play a sound to mask the slurping noise.","a":"when… 为时间状语从句；主句 the fork / sends / a signal；making… 为结果状语。","why":"using the fork 修饰 person；making 短语内 it 是宾语、play… 是宾补，to mask… 是目的状语。","state":"核对","tag":"主从层级","note":"可见对 using… 定语、making… 状语的判断方向正确。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["when从句交代人开始喝汤的时间，主句是the fork sends a signal：叉子发出信号。using the fork只是修饰person，表示使用叉子的那个人。","making it play a sound说明信号带来的结果，是主句后的结果状语。这个短语内部，it指手机，play a sound说明手机做什么，是make的宾补；to mask…又说明播放声音的目的。"],"related":[{"id":"q32","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"},{"id":"q45","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"},{"id":"q51","reason":"长句分层对照：先读主句，再分析附属从句或短语，内部宾语不能直接当成主句宾语。"}]},{"id":"q54","chapter":"句 。前句完整动词部分为have compared，后句为fade away。","have在这里帮助构成现在完成时，不是单独的谓语答案。long插在助动词和过去分词之间作状语，不会切断have compared这个结构。"],"related":[{"id":"q48","reason":"都要完整识别谓语：助动词与实义动词合看；and可能连接同一主语下的两个动作。"},{"id":"q62","reason":"都要完整识别谓语：助动词与实义动词合看；and可能连接同一主语下的两个动作。"}]},{"id":"q60","chapter":"句子成分","page":9,"ref":"进阶二·7","q":"The ability of bats to coexist with viruses that can spill over to other animals, in particular humans, can have devastating markets and invade their territory.","a":"可确定主语核心 ability；主句谓语 can have… and invade…；that…humans 修饰 viruses。","why":"to coexist… 说明 ability 的内容，不是限定谓语。原文 devastating markets / invade their territory 语义搭配异常，不宜直接视为正常范句，更不应擅改成 impacts 再评分。","state":"有歧义","tag":"原题质量","note":"此题保留结构提示，完整句意暂不判分。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["to coexist… 说明 ability 的内容，不是限定谓语。","原文 devastating markets / invade their territory 语义搭配异常，不宜直接视为正常范句，更不应擅改成 impacts 再评分。"],"related":[{"id":"q44","reason":"这些原题的搭配或语义有问题。只分析可确定的主干，原题的问题不归因于学生。"},{"id":"q61","reason":"这些原题的搭配或语义有问题。只分析可确定的主干，原题的问题不归因于学生。"}]},{"id":"q61","chapter":"句子成分","page":9,"ref":"进阶二·8","q":"Animals have limited food and water resources and little shelter from predators, predators that could cause further mortality in the weeks and months after smoke of fires clear.","a":"Animals 主语；have 谓语；limited food and water resources 与 little shelter… 并列宾语。","why":"重复的 predators 可按解释性同位结构理解，that… 修饰它；after… 是内部时间从句。原文 smoke…clear 存在主谓搭配问题。","state":"有歧义","tag":"原题质量","note":"首层结构可讲解，句末原题问题不计学生错误。","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["重复的 predators 可按解释性同位结构理解，that… 修饰它；after… 是内部时间从句。","原文 smoke…clear 存在主谓搭配问题。"],"related":[{"id":"q44","reason":"这些原题的搭配或语义有问题。只分析可确定的主干，原题的问题不归因于学生。"},{"id":"q60","reason":"这些原题的搭配或语义有问题。只分析可确定的主干，原题的问题不归因于学生。"}]},{"id":"q62","chapter":"句子成分","page":9,"ref":"进阶二·9","q":"Such work will help build a more complete picture of wildfire impacts and will better inform the conservation measures needed to prevent the astonishing scenes of recent weeks from becoming the new normal.","a":"Such work 主语；will help 与 will inform 为并列谓语；needed… 后置修饰 measures。","why":"build… 依附 help，完整词组 help (to) do；prevent…from doing 为固定结构。needed 没有独立的时态，不是第三个主句谓语。","state":"核对","tag":"谓语与非谓语","note":"","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["先看主语Such work，它对应两个将来动作：will help…和will inform…。and把这两个谓语结构连接起来。","build依附于help，help (to) do表示帮助做某事；needed…紧跟measures，表示“所需要的措施”，是过去分词修饰语。needed没有在主句中另立时态，不能数成第三个并列谓语。"],"related":[{"id":"q33","reason":"长修饰语会遮住主干；先找整句主语与谓语，再回看名词内部的修饰成分。"},{"id":"q52","reason":"长修饰语会遮住主干；先找整句主语与谓语，再回看名词内部的修饰成分。"},{"id":"q48","reason":"都要完整识别谓语：助动词与实义动词合看；and可能连接同一主语下的两个动作。"}]},{"id":"q63","chapter":"句子成分","page":9,"ref":"进阶二·10","q":"Apples, as the two researchers observed, came to be associated with important people and places in American slang by the turn of the 20th century.","a":"Apples 主语；came to be associated… 为谓语结构；as…observed 为插入性的非限制性从句；in…、by… 为状语。","why":"be associated with 表“与……有关”；by the turn… 给出时间范围。不要把 researchers 当主句主语。","state":"核对","tag":"主从层级","note":"","task":"分析句子成分，先划分主句与从句，再标明各层内部成分。","explanation":["先把两个逗号中的as the two researchers observed暂时拿开，主干是Apples came to be associated with…，表示apples这个词逐渐与某些人和地点联系起来。","researchers只是插入评论中的主语，不是主句主语。as在这里引出“正如两位研究者所观察到的”这一补充说明；主句仍围绕Apples展开。"],"related":[{"id":"q50","reason":"都带有插入或解释信息：同位语解释名词，as插入语补充评论，不能把它们混为主句谓语。"}]},{"id":"q64","chapter":"句子成分","page":9,"ref":"句型段落·1","q":"Life in a Day is a film about everyday lives of people in different countries.","a":"SVP","why":"主语是影片名；is 为系动词，a film… 为表语。长定语不改变基本句型。","state":"正确","tag":"句型","note":"","task":"写出句子的基本结构：SV、SVO、SVOO、SVP或SVOOC；有从句时先看主句。","explanation":["Life in a Day是影片名，整个名称作主语；is连接影片与对它的介绍a film about…，所以是主系表结构（本卷记SVP）。","a film后面的长修饰语只是把影片介绍得更具体，不会把原本的主系表结构变成主谓宾。"],"related":[{"id":"q15","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"},{"id":"q16","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"},{"id":"q17","reason":"同为系动词后说明主语：feel、turn、become和is后面才是表语，助动词仍属于动词部分。"}]},{"id":"q65","chapter":"句子成分","page":9,"ref":"句型段落·2","q":"The director Kevin Macdonald created a picture of the world as a digital time capsule for the future.","a":"SVO","why":"The director Kevin Macdonald 为主语，created 为谓语，a picture… 为宾语。as a digital time capsule 表用途/身份说明。","state":"正确","tag":"句型","note":"","task":"写出句子的基本结构：SV、SVO、SVOO、SVP或SVOOC；有从句时先看主句。","explanation":["问“谁做了什么”：导演Kevin Macdonald（主语）created（谓语，创作了）a picture of the world（宾语，一幅世界图景）。","后面的as a digital time capsule for the future说明作品的用途或定位，不改变主干是主谓宾（SVO）。"],"related":[]},{"id":"q66","chapter":"句子成分","page":9,"ref":"句型段落·3","q":"He asked people around the world to film a short video for their daily routines on a typical day.","a":"SVOOC","why":"He / asked / people around the world / to film…；不定式为宾补。","state":"正确","tag":"句型","note":"","task":"写出句子的基本结构：SV、SVO、SVOO、SVP或SVOOC；有从句时先看主句。","explanation":["He asked people around the world先交代“他要求谁”，to film a short video再说明“要求这些人做什么”。","people around the world是宾语，to film…是补充宾语动作的不定式，所以主干为主谓宾宾补（SVOOC），不是把people和video当两个并列宾语。"],"related":[{"id":"q22","reason":"相同结构：动词＋人＋to do。人是宾语，to do说明这个人要做的事，是宾语补足语。"},{"id":"q23","reason":"相同结构：动词＋人＋to do。人是宾语，to do说明这个人要做的事，是宾语补足语。"}]},{"id":"q67","chapter":"句子成分","page":10,"ref":"句型段落·4","q":"Then he and his team turned them into a film.","a":"本讲义五句型框架常按 SVO；into a film 是必需的结果补足成分。","why":"更细语法体系可分析为 SVO＋结果补足语（或 SVOA/SVOC）。理解“把它们变成影片”比死认一个缩写重要。","state":"有歧义","tag":"句型","note":"照片写 SVO，不据体系差异判错。","task":"写出句子的基本结构：SV、SVO、SVOO、SVP或SVOOC；有从句时先看主句。","explanation":["更细语法体系可分析为 SVO＋结果补足语（或 SVOA/SVOC）。","理解“把它们变成影片”比死认一个缩写重要。"],"related":[{"id":"q56","reason":"对照动词后的成分：介词短语、结果补足成分和被动或状态结构不能一律按直接宾语处理。"},{"id":"q57","reason":"对照动词后的成分：介词短语、结果补足成分和被动或状态结构不能一律按直接宾语处理。"},{"id":"q68","reason":"对照动词后的成分：介词短语、结果补足成分和被动或状态结构不能一律按直接宾语处理。"}]},{"id":"q68","chapter":"句子成分","page":10,"ref":"句型段落·5","q":"The scenes are well connected.","a":"按“被连接起来”的动作理解为被动结构；按“衔接紧密”的状态理解可记 SVP。","why":"connected 可为被动分词，也可形容词化。该句缺少上下文，不能把 SVP 或被动分析其中 成成为had been seated；第二个动词start则填started。","原题前两个空分开填写had与been seated，不能把所有单词挤进同一个空。"],"related":[{"id":"q133","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"},{"id":"q166","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"},{"id":"q176","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"}]},{"id":"q119","chapter":"时态与语态","page":15,"ref":"小试牛刀·12","q":"Since he ___ (graduate), he ___ (not visit) his alma mater.","a":"graduated；hasn’t visited","why":"since 从句给出过去起点；主句说明从那时到现在没有发生的事。","state":"正确","tag":"完成体","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["毕业是过去已经发生的时间起点，而“没有回访母校”覆盖从毕业到现在这一整段时间。","因此since从句用graduated，主句用hasn’t visited。两处空不该填成同一种时态：一个标记起点，一个概括此后至今。"],"related":[{"id":"q110","reason":"对比since的两种意思：既然（原因）不机械决定时态；自从（时间）常配过去起点＋现在完成主句。"},{"id":"q151","reason":"对比since的两种意思：既然（原因）不机械决定时态；自从（时间）常配过去起点＋现在完成主句。"}]},{"id":"q120","chapter":"时态与语态","page":15,"ref":"小试牛刀·13","q":"That is the first time that I ___ (inform) of the changes of the meeting.","a":"have been informed","why":"现在的首次经历＋我被通知：现在完成被动。have 与 I 一致。","state":"正确","tag":"完成被动","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["That is the first time把参照点放在现在，谈截至现在的第一次经历，所以从句要用现在完成时。","I不是发通知的人，而是被告知会议变更的人，因此再加被动。三部分合起来：have（完成时，与I一致）＋been（被动be的过去分词）＋informed。"],"related":[{"id":"q160","reason":"同是This/That is the…time：后句用现在完成；inform还要加被动，be本身则用have been。"}]},{"id":"q123","chapter":"时态与语态","page":16,"ref":"A01","q":"—What’s the matter, Sara? You wear a sad look on your face. —Oh, nothing much. As a matter of fact I ___ (just, think) of my friends back home.","a":"was just thinking","why":"回答“你刚才为何难过”，回看紧接说话前的思绪，用过去进行时。若强调仍在想，am just thinking 也有语境空间。","state":"正确","tag":"进行体","note":"照片 was just thinking 与本题意图一致。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["对方看见Sara脸色难过，Sara解释的是“刚才正在想家乡的朋友”。这里是在回看被问话之前的那段思绪，因此was just thinking贴合对话。","这不等于现在还在继续想；若语境特别强调此刻仍在想，am just thinking也有空间。原题没有把所有可能语境排除，不宜只凭这一差别判定能力。"],"related":[{"id":"q125","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"},{"id":"q170","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"},{"id":"q171","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"}]},{"id":"q124","chapter":"时态与语态","page":16,"ref":"A02","q":"Because of climate change, the ice that polar bears depend on for survival ___ (disappear) slowly.","a":"is disappearing","why":"主语核心 ice，不可数；冰正在逐渐消失，是当前变化过程；disappear 不及物，不用被动。","state":"正确","tag":"主谓一致","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["先找空格真正对应的主语：the ice。that polar bears depend on for survival只是修饰ice，意思是北极熊赖以生存的冰。","slowly disappearing描述目前正在发生的变化，因此用现在进行时；ice不可数，配is。disappear表示自行消失，不直接接宾语，所以这里不写is being disappeared。"],"related":[{"id":"q136","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"},{"id":"q169","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"},{"id":"q190","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"}]},{"id":"q125","chapter":"时态与语态","page":16,"ref":"A03","q":"I called Alice many times yesterday evening, but I couldn’t get through. Her brother ___ (talk) on the phone all the time!","a":"was talking","why":"昨晚反复打不通，哥哥那段时间一直占线；用过去进行，不是否定。","state":"待核字","tag":"进行体","note":"手写在 was 与 talking 间的笔画不清；先给出标准解析，不确认首答是否含 not。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["前句说昨晚打了很多次电话都打不通。后句解释原因：在那段时间里，她哥哥一直在通电话，把电话占着。","yesterday evening和called把场景放到过去，all the time在这里强调这段时间内一直进行。因此用was talking：was表示过去，talking表示当时进行。","不是一看到all the time就必用进行时，而是它与“反复拨打却不通”的背景相互呼应。本题表达在讲话，不应自行加not。原手写笔画不清，不能据此确认首答是否写了否定。"],"related":[{"id":"q170","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"},{"id":"q123","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"},{"id":"q171","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"}]},{"id":"q126","chapter":"时态与语态","page":16,"ref":"A04","q":"The day we had been looking forward to ___ (come) at last.","a":"came","why":"we had been looking forward to 是修饰 day 的定语从句；to 的宾语是被省略的关系词。空格是主句谓语，不能被 look forward to doing 诱导成 coming。","state":"已订正","tag":"谓语与非谓语","note":"可见原答 coming，蓝笔订正 came。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["先暂时括起we had been looking forward to，句子就剩The day ___ at last：那一天终于到了。空格是整个主句的谓语，不能缺一个能独立表达时态的动词。","括起的部分相当于(that) we had been looking forward to，修饰day；还原就是we had been looking forward to the day。介词to对应的是day，不是在要求空格接doing。","所以填came。填coming虽然像套用了look forward to doing，却会让外层The day没有谓语；这才是错误的根源。"],"related":[{"id":"q132","reason":"直接对照：look forward to/devote oneself to都在修饰主语的从句内部；空格却是主句谓语，不能填-ing。"}]},{"id":"q127","chapter":"时态与语态","page":16,"ref":"A05","q":"The manager as well as the staff ___ (chat) cheerfully during the tea break when the boss came in.","a":"was chatting","why":"as well as the staff 不改变主语中心 manager 的单数；过去的 came in 对应当时正在聊天。","state":"正确","tag":"主谓一致","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["老板进来came in时，聊天是当时正在进行的动作，因此先确定过去进行时。","再看主语中心：The manager。as well as the staff是附带的“以及员工”，这里不把主语变成复数，所以用was chatting，而不是were chatting。"],"related":[{"id":"q128","reason":"共同检查单数主语：manager不受as well as影响；动名词短语整体作主语；every/each means也是单数。"},{"id":"q146","reason":"共同检查单数主语：manager不受as well as影响；动名词短语整体作主语；every/each means也是单数。"},{"id":"q174","reason":"共同检查单数主语：manager不受as well as影响；动名词短语整体作主语；every/each means也是单数。"}]},{"id":"q128","chapter":"时态与语态","page":16,"ref":"A06","q":"Many college students register at driving schools during the summer vacation, saying that getting a license ___ (give) them an advantage in the job market.","a":"gives 或 will give","why":"gives 表一般看法“有驾照带来优势”；will give 表将来求职会有优势。getting a license 整体为单数主语。","state":"有歧义","tag":"多解","note":"原答 gives 与订正 will give 均可解释，不列为确定错题。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["getting a license表示“取得驾照”这件事，整个动名词短语作主语，按单数处理。","如果解释一般看法“驾照能带来求职优势”，填gives；如果强调将来的求职收益，填will give。两种读法都符合句子，不应只保留其中一个作为唯一答案。"],"related":[{"id":"q127","reason":"共同检查单数主语：manager不受as well as影响；动名词短语整体作主语；every/each means也是单数。"},{"id":"q146","reason":"共同检查单数主语：manager不受as well as影响；动名词短语整体作主语；every/each means也是单数。"},{"id":"q174","reason":"共同检查单数主语：manager不受as well as影响；动名词短语整体作主语；every/each means也是单数。"}]},{"id":"q129","chapter":"时态与语态","page":16,"ref":"A07","q":"I’m sure that your letter ___ (get) immediate attention. They know you’re waiting for the reply.","a":"will get","why":"语境是对即将得到关注作保证；your letter 主动“得到”关注，不用被动。","state":"已订正","tag":"将来表达","note":"可见 gets 订正为 will get。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["语境是对即将得到关注作保证；your letter 主动“得到”关注，不用被动。"],"related":[{"id":"q177","reason":"将来主动与被动对照：get attention、go on sale是主动表达，hard work得到回报则用be repaid。"},{"id":"q182","reason":"将来主动与被动对照：get attention、go on sale是主动表达，hard work得到回报则用be repaid。"}]},{"id":"q130","chapter":"时态与语态","page":16,"ref":"A08","q":"Everyone who saw Star Wars said that it ___ (be) one of the best science fiction movies that had ever been released.","a":"was","why":"空格位于 said 后的宾语从句，说明当时的评价；后面的 had ever been released 已在题干中，不是要填的内容。","state":"已订正","tag":"过去参照","note":"原答像 is，已订正 was。上次回复误将填空定位到 released，本版已更正。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["先锁定空格的位置：said that it ___ one of the best…，要补的是“他们说这部电影当时是最好的电影之一”。主句said是过去叙述，所以这里填was。","末尾that had ever been released是修饰movies的另一个从句，意思是此前发行过的影片。had ever been released已经在原题里，不是这一空要填的答案。先找空格对应的分句，比在整句里搜时态词更重要。"],"related":[{"id":"q158","reason":"主句过去叙述帮助确定从句时态，但空格含义仍要分别判断：当时的评价was与被直播was televised。"}]},{"id":"q131","chapter":"时态与语态","page":16,"ref":"A09","q":"During the 60 years since the founding of the New China, we ___ (go) through millions of ups and downs.","a":"have gone","why":"原题以说话当时为终点回顾60年；since 起点至当时，用现在完成。保留历史原题时间，不改为今年的年数。","state":"正确","tag":"完成体","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["原题以说话当时为终点回顾60年；since 起点至当时，用现在完成。","保留历史原题时间，不改为今年的年数。"],"related":[{"id":"q143","reason":"现在完成强调截至现在的经历或结果；完成进行更突出持续过程，是否被动还要看动词与主语关系。"},{"id":"q152","reason":"现在完成强调截至现在的经历或结果；完成进行更突出持续过程，是否被动还要看动词与主语关系。"},{"id":"q180","reason":"现在完成强调截至现在的经历或结果；完成进行更突出持续过程，是否被动还要看动词与主语关系。"}]},{"id":"q132","chapter":"时态与语态","page":16,"ref":"A10","q":"The cause he had devoted himself to ___ (prove) a perfect success.","a":"proved","why":"he had devoted himself to 修饰 cause；空格为主句谓语。prove 在这里是系动词“结果证明是”，不需 was proved。","state":"正确","tag":"谓语与非谓语","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["暂时括起he had devoted himself to，外层剩The cause ___ a perfect success：这项事业最终证明非常成功。空格必须作主句谓语。","从句还原为he had devoted himself to the cause，所以to已经与cause建立关系，不要求后面的prove改成proving。","这里prove意为“结果证明是”，相当于系动词，用主动形式proved；不是“被某个人证明”，不需要was proved。"],"related":[{"id":"q126","reason":"直接对照：look forward to/devote oneself to都在修饰主语的从句内部；空格却是主句谓语，不能填-ing。"}]},{"id":"q133","chapter":"时态与语态","page":17,"ref":"A11","q":"The manager entered the office and was happy to learn that four-fifths of the tickets ___ (book).","a":"had been booked","why":"订票已先于 entered / learned 完成；tickets 是被预订的：had＋been＋booked。","state":"已订正","tag":"完成被动","note":"可见 were booked 订正为 had been booked。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["经理走进办公室时，得知票已经被订好了。先用entered和was happy确立过去参照，再看订票发生在此之前，所以需要过去完成。","主语tickets不是订票的人，而是被订的对象，因此还要被动。完整形式是had been booked，少been就丢掉了“被订”的关系。"],"related":[{"id":"q118","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"},{"id":"q166","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"},{"id":"q176","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"}]},{"id":"q134","chapter":"时态与语态","page":17,"ref":"A12","q":"Rainforests ___ (cut) and burned at such a speed that they will disappear from the earth in the near future.","a":"are being cut","why":"强调现在正以某速度被砍伐，用进行被动。若纯粹陈述常态，are cut 也可，但本题语境更突出正在发生的过程。","state":"已订正","tag":"进行被动","note":"可见 are cut 订正为 are being cut；不是所有一般现在被动都不合语法。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["句子说雨林正以如此快的速度遭受砍伐和焚烧，以至于将来可能消失。at such a speed与未来后果一起突出当前持续发生的破坏过程。","雨林是被砍的，用被动；正在遭受砍伐，用进行。复数Rainforests配are，组合为are being cut；后面的burned与cut并列，共用are being。","只写are cut可表达反复常态，但本题更突出眼下正在发生的过程。本卷B50是同一道题，不算新的变式。"],"related":[{"id":"q192","reason":"原文重复：A12与B50是同一道题，不是新变式。"},{"id":"q145","reason":"同为现在进行被动：正在＋被……，完整形式是am/is/are being＋过去分词，不是只加-ing。"},{"id":"q147","reason":"同为现在进行被动：正在＋被……，完整形式是am/is/are being＋过去分词，不是只加-ing。"}]},{"id":"q135","chapter":"时态与语态","page":17,"ref":"A13","q":"John had to have his car repaired in a garage because it ___ (damage) seriously.","a":"had been damaged（was damaged 也可作自然叙述）","why":"考试意图是损坏先于送修＋被动。because 已明确因果，一般过去被动也可能成立，不能仅据语法认定绝对错误。","state":"有歧义","tag":"完成被动","note":"照片由 was damaged 订正 had been damaged；学习更明确的先后表达。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["考试意图是损坏先于送修＋被动。","because 已明确因果，一般过去被动也可能成立，不能仅据语法认定绝对错误。"],"related":[{"id":"q114","reason":"这些题要区分讲义偏好的过去完成与语境中同样可能的过去时；不能把可接受的另一种叙述直接判错。"},{"id":"q117","reason":"这些题要区分讲义偏好的过去完成与语境中同样可能的过去时；不能把可接受的另一种叙述直接判错。"},{"id":"q179","reason":"这些题要区分讲义偏好的过去完成与语境中同样可能的过去时；不能把可接受的另一种叙述直接判错。"}]},{"id":"q136","chapter":"时态与语态","page":17,"ref":"A14","q":"The first use of atomic weapons was in 1945, and their power ___ (increase) enormously ever since.","a":"has increased","why":"ever since 表示自那时至今；主语是单数 power，不是 weapons；increase 可不及物，表示威力增长。","state":"订正需复核","tag":"主谓一致","note":"原答 has increased 合理；蓝笔疑似 have been increased 不宜采纳：首先 have 与 power 不一致。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["ever since指从前文1945年一直到说话时，因此用现在完成时。主语不是weapons，而是their power；power在这里是单数，所以助动词用has。","increase在这句中表示“威力增长”，本身可以不及物，不需要被动。于是答案是has increased，而不是have been increased。","原答has increased合理。蓝笔修改不能自动作为正确答案，尤其不能忽略power与have不一致的问题。"],"related":[{"id":"q124","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"},{"id":"q169","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"},{"id":"q190","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"}]},{"id":"q137","chapter":"时态与语态","page":17,"ref":"A15","q":"The number of deaths from heart disease will be reduced greatly if people ___ (persuade) to eat more fruit and vegetables.","a":"are persuaded","why":"人们被劝说，需被动；if 条件从句表示将来用一般现在；people 复数配 are。","state":"已订正","tag":"主动被动","note":"可见 persuades 订正为 are persuaded。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["“如果人们被说服多吃水果蔬菜，死亡人数就会大幅减少。”people是接受劝说的人，因此persuade要用被动，不是people persuade。","if条件从句谈将来通常用现在时，people为复数，因此拼出are persuaded。主句will be reduced里的will不复制到if从句中。"],"related":[{"id":"q79","reason":"时间或条件从句谈将来，通常用现在形式；但若主语承受动作，还必须加被动结构。"},{"id":"q113","reason":"时间或条件从句谈将来，通常用现在形式；但若主语承受动作，还必须加被动结构。"},{"id":"q99","reason":"时间或条件从句谈将来，通常用现在形式；但若主语承受动作，还必须加被动结构。"}]},{"id":"q138","chapter":"时态与语态","page":17,"ref":"A16","q":"With the help of high technology, more and more new substances ___ (discover) in the past years.","a":"have been discovered","why":"in the past years 指过去一段时间至今；substances 复数且被发现：have been discovered。","state":"待核字","tag":"完成被动","note":"照片有重写痕迹，最终答案似为 have been discovered，不据此推断首答错误。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["in the past years把发现活动从过去联系到现在，所以采用现在完成时。substances是发现的对象，不是作出发现的人，所以还要被动。","主语more and more new substances为复数，完整写法为have been discovered。have负责完成时和一致关系，been不能省，它是被动结构的一部分。"],"related":[{"id":"q136","reason":"对比现在完成主动和被动：威力自身增长has increased；物质被发现、俱乐部被经营、问题被讨论则要been。"},{"id":"q144","reason":"对比现在完成主动和被动：威力自身增长has increased；物质被发现、俱乐部被经营、问题被讨论则要been。"},{"id":"q164","reason":"对比现在完成主动和被动：威力自身增长has increased；物质被发现、俱乐部被经营、问题被讨论则要been。"}]},{"id":"q139","chapter":"时态与语态","page":17,"ref":"A17","q":"Our monitor, who by then ___ (gain) admission to Fudan University, decided to do some part-time jobs to gain practical experience.","a":"had gained","why":"by then 的 then 指过去决定打工的时候；在那之前已获得录取，用过去完成。gain admission 主动，不用被动。","state":"已订正","tag":"过去参照","note":"可见 gained 订正为 had gained。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["先找到then指哪一刻：过去decided to do some part-time jobs的时候。by then意味着在这个决定作出时，他已经拿到了录取资格。","因此gain admission用过去完成had gained。who指our monitor，班长是获得录取的人，这个表达用主动，不需had been gained。"],"related":[{"id":"q108","reason":"共同点是过去的参照时刻之前已经发生：先找参照点，再向前看；过去完成用had＋过去分词。"},{"id":"q153","reason 用括号内词的适当形式或合适的动词结构填空。","explanation":["until several discussions have been made在这里不是说讨论已经结束，而是规定将来的条件：“直到进行了几轮讨论之后，才会……”。","主句表达届时才能得出结论，所以用将来时；conclusion是被得出的，reach用被动，得到will be reached。No conclusion…until合起来表示在此之前不会得出结论。"],"related":[{"id":"q175","reason":"将来形式对比：将被完成、届时已经被完成、届时正在进行，分别对应将来被动、将来完成被动、将来进行。"},{"id":"q184","reason":"将来形式对比：将被完成、届时已经被完成、届时正在进行，分别对应将来被动、将来完成被动、将来进行。"}]},{"id":"q168","chapter":"时态与语态","page":18,"ref":"B26","q":"They were ahead during the first half of the match, but they ___ (beat) in the last five minutes.","a":"were beaten","why":"他们最后被击败；与 were ahead 同属过去。beat—beat—beaten。","state":"待做","tag":"主动被动","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["前半句他们曾领先，后半句but说明最后五分钟形势反转，他们被击败了。两部分都在叙述过去这场比赛。","主语they是被击败的一方，因此填were beaten。beat的过去式是beat，过去分词是beaten，被动结构需要后者。"],"related":[{"id":"q149","reason":"过去事件的被动表达：主语承受发现、要求、直播、对待、击败或销售；用was/were＋过去分词。"},{"id":"q156","reason":"过去事件的被动表达：主语承受发现、要求、直播、对待、击败或销售；用was/were＋过去分词。"},{"id":"q158","reason":"过去事件的被动表达：主语承受发现、要求、直播、对待、击败或销售；用was/were＋过去分词。"}]},{"id":"q169","chapter":"时态与语态","page":18,"ref":"B27","q":"The number of children who contracted colds and visited the hospital ___ (increase) in the county since last fall.","a":"has increased","why":"主语中心是 number，不是 children；since 起点至今；increase 在此不及物。","state":"待做","tag":"主谓一致","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["先找主语中心：The number，意思是人数；of children和who…hospital只在解释统计的是哪些孩子。","since last fall把增长过程联系到现在，用现在完成；number单数配has，increase在此不及物，完整答案为has increased，不是have increased或has been increased。"],"related":[{"id":"q161","reason":"主谓一致对照：course后两个并列谓语都要单数；the number of children的中心是number而非children。"},{"id":"q124","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"},{"id":"q136","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"}]},{"id":"q170","chapter":"时态与语态","page":18,"ref":"B28","q":"—Has Tim finished writing his annual budget report? —I have no idea. He ___ (do) it this morning.","a":"was doing","why":"只知道今早在做，不知道完成与否；进行时提供过程而非完成结论。","state":"待做","tag":"进行体","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["问句在问Tim是否已经写完；回答者说不知道，只能提供“今早他当时正在写”的观察。","所以was doing恰好说明过程而不保证完成。若用had done或has done，就会给出已经完成的判断，与I have no idea这一回答意图不符。"],"related":[{"id":"q125","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"},{"id":"q123","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"},{"id":"q171","reason":"对比说话时、刚才和过去某时的动作：不能只凭整句有过去词就让所有分句统一用过去时。"}]},{"id":"q171","chapter":"时态与语态","page":18,"ref":"B29","q":"I can tell you were in such a hurry. You ___ (wear) your classy dinner jacket inside out.","a":"are wearing","why":"现在看见衣服穿反，据此推断之前出门匆忙；不同分句可有不同时间参照。","state":"待做","tag":"进行体","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["对方现在穿反了衣服，这是说话人眼前看见的情况，因此空格用are wearing。前面的were in such a hurry是在据此推测他先前出门很匆忙。","一个句子可以同时提到现在的证据和过去的原因，不必把两个分句强行统一成过去时。"],"related":[{"id":"q78","reason":"都用现在进行时，但理由不同：带情绪的反复、当前阶段的暂时行为，或眼前正在发生的情况。"},{"id":"q82","reason":"都用现在进行时，但理由不同：带情绪的反复、当前阶段的暂时行为，或眼前正在发生的情况。"},{"id":"q111","reason":"都用现在进行时，但理由不同：带情绪的反复、当前阶段的暂时行为，或眼前正在发生的情况。"}]},{"id":"q172","chapter":"时态与语态","page":18,"ref":"B30","q":"A woman came into a clinic with a baby who she said ___ (swallow) a sleeping pill.","a":"had swallowed","why":"婴儿吞药先于来到诊所和说话；she said 为插入报告语，who 指 baby。","state":"待做","tag":"过去参照","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["先理解先后：婴儿先吞了安眠药，女人才带他到诊所，并向人说明情况。吞药发生在came和said这两个过去动作之前。","因此填had swallowed。who指baby，she said是中间插入的报告信息；不能把she误当成swallow的主语。"],"related":[{"id":"q108","reason":"共同点是过去的参照时刻之前已经发生：先找参照点，再向前看；过去完成用had＋过去分词。"},{"id":"q139","reason":"共同点是过去的参照时刻之前已经发生：先找参照点，再向前看；过去完成用had＋过去分词。"},{"id":"q153","reason":"共同点是过去的参照时刻之前已经发生：先找参照点，再向前看；过去完成用had＋过去分词。"}]},{"id":"q173","chapter":"时态与语态","page":18,"ref":"B31","q":"Boys and girls, make sure you ___ (write) your names on the test paper before handing them in.","a":"write / have written","why":"write 表务必去写；have written 表交卷前确认已写好。两者都合语法，不能设成 ation":["前半说原计划；but 后叙述实际未执行的过去事实。"],"related":[{"id":"q117","reason":"共同包含未实现的计划：先前的希望或打算与后来实际没做分开叙述。"}]},{"id":"q187","chapter":"时态与语态","page":19,"ref":"B45","q":"—Bob has gone to California. —Oh, can you tell me when he ___ (leave)?","a":"left","why":"询问已发生动作的具体过去时间；不能照搬前句现在完成。","state":"待做","tag":"时间参照","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["Bob has gone先交代现在的情况：Bob已去了加州。后一句when追问的是“他具体什么时候离开的”，把注意力转向已经发生的过去动作。","因此填left。前句现在完成不要求后句也用现在完成；问一个已发生动作的具体过去时间，通常用一般过去时。"],"related":[{"id":"q151","reason":"对比现在完成与一般过去：持续到现在、已结束的过去阶段、追问过去时间，不能只看for或前句时态。"},{"id":"q159","reason":"对比现在完成与一般过去：持续到现在、已结束的过去阶段、追问过去时间，不能只看for或前句时态。"},{"id":"q163","reason":"对比现在完成与一般过去：持续到现在、已结束的过去阶段、追问过去时间，不能只看for或前句时态。"}]},{"id":"q188","chapter":"时态与语态","page":19,"ref":"B46","q":"Our friendship ___ (develop) quickly over the weeks that followed.","a":"developed","why":"that followed 把这几周限定为叙述中的过去；develop 在此不及物。","state":"待做","tag":"时间参照","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["that followed 把这几周限定为叙述中的过去；develop 在此不及物。"],"related":[{"id":"q151","reason":"对比现在完成与一般过去：持续到现在、已结束的过去阶段、追问过去时间，不能只看for或前句时态。"},{"id":"q159","reason":"对比现在完成与一般过去：持续到现在、已结束的过去阶段、追问过去时间，不能只看for或前句时态。"},{"id":"q163","reason":"对比现在完成与一般过去：持续到现在、已结束的过去阶段、追问过去时间，不能只看for或前句时态。"}]},{"id":"q189","chapter":"时态与语态","page":19,"ref":"B47","q":"Though he ___ (tell) many times, he still had no idea of this complicated concept.","a":"had been told","why":"被告知发生在过去仍不理解之前；过去完成被动。","state":"待做","tag":"完成被动","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["主句he still had no idea把“不理解”放在过去；被反复告知发生在这个过去状态之前，所以用过去完成。","He是被告知的人，需要被动，组合成had been told。many times说明次数，并不能单独决定现在完成或过去完成，关键是had no idea给出的参照。"],"related":[{"id":"q118","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"},{"id":"q133","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"},{"id":"q166","reason":"都是过去之前＋被动：had表示过去完成，been保留被动的be，最后接实义动词过去分词。"}]},{"id":"q190","chapter":"时态与语态","page":19,"ref":"B48","q":"The last of four unmanned experimental US military aircraft designed to fly at six times the speed of sound ___ (expect) to be tested next year.","a":"is expected","why":"主语核心 The last，单数；目前预计明年测试。next year 修饰 to be tested，不要求主句 expected 用将来时。","state":"待做","tag":"主谓一致","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["长主语中真正的中心是The last，指四架飞机中的最后一架，因此按单数。designed to fly…只是修饰飞机的短语。","目前的预期是“它将在明年接受测试”，空格描述当前被预计的状态，填is expected；next year属于后面的to be tested，不要求空格也用将来时。"],"related":[{"id":"q124","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"},{"id":"q136","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"},{"id":"q169","reason":"都要越过修饰部分找到真正主语：ice、power、number、the last；近处的复数名词不一定决定动词。"}]},{"id":"q191","chapter":"时态与语态","page":19,"ref":"B49","q":"Some celebrities are eager to make their private lives known to the public for fear that no notice ___ (pay) to them.","a":"will be paid（也可 should be paid）","why":"按“担心未来无人关注”用将来被动；for fear that 后也可用 should 表所担忧的情况。notice 为不可数。","state":"待做","tag":"多解","note":"","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["按“担心未来无人关注”用将来被动；for fear that 后也可用 should 表所担忧的情况。","notice 为不可数。"],"related":[]},{"id":"q192","chapter":"时态与语态","page":19,"ref":"B50","q":"Rainforests ___ (cut) and burned at such a speed that they will disappear from the earth in the near future.","a":"are being cut","why":"与 A12 同题；当前正在遭受砍伐，进行被动。重复题只能检查保持情况，不能当作新的迁移证据。","state":"待做","tag":"进行被动","note":"与 A12 重复，不重复计入独立题量。","task":"根据上下文，用括号内词的适当形式或合适的动词结构填空。","explanation":["这一题与第17页A12原文重复：雨林目前正遭受快速砍伐和焚烧，将来可能因此消失，所以用现在进行被动are being cut。","cut与后面的burned共用are being，不能因cut本身形式没变化就省去being。再次做对相同原题可用于巩固，但不是新情境迁移的证据。"],"related":[{"id":"q134","reason":"原文重复：A12与B50是同一道题，不是新变式。"},{"id":"q145","reason":"同为现在进行被动：正在＋被……，完整形式是am/is/are being＋过去分词，不是只加-ing。"},{"id":"q147","reason":"同为现在进行被动：正在＋被……，完整形式是am/is/are being＋过去分词，不是只加-ing。"}]},{"id":"q195","chapter":"定语从句","page":20,"ref":"关系代词·1","q":"The man ___ is shaking hands with my father is a policeman.","a":"who / that","why":"先行词 man 指人；从句在 is shaking 前缺主语。主语关系词不能省略。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["先行词是the man，后面的___ is shaking hands with my father用来说明是哪一个人。从句中is shaking前面缺“谁在握手”的主语。","因此用指人的who或that；关系词自己充当从句主语，不能省略，也不能再重复添加he。"],"related":[{"id":"q196","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"},{"id":"q209","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"},{"id":"q211","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"}]},{"id":"q196","chapter":"定语从句","page":20,"ref":"关系代词·2","q":"The factory ___ makes computers is far away from here.","a":"which / that","why":"factory 虽是地点，但从句 makes 前缺主语，因此不能填 where。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["factory虽然表示工厂这个地点，但先看后面的___ makes computers：makes前面没有主语，缺的是“谁/什么制造电脑”。","因此填which或that，把factory带入从句作主语。where只补地点“在哪里”，不能充当makes的主语，所以此处不能用where。"],"related":[{"id":"q195","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"},{"id":"q209","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"},{"id":"q211","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"}]},{"id":"q197","chapter":"定语从句","page":20,"ref":"关系代词·3","q":"He has a friend ___ father is a doctor.","a":"whose","why":"从句有主语 father，但需说明“谁的父亲”；whose 作 father 的限定语。","state":"待做","tag":"所属关系","note":"","task":"填写合适的关系词或关系词短语。","explanation":["后面的从句说“他的父亲是一名医生”。father已经是is的主语，缺的不是另一个人称主语，而是father前面的所属限定——谁的父亲。","friend的父亲可以写his father，在定语从句里把his换成whose，得到whose father is a doctor。因此不能填who father。"],"related":[{"id":"q198","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"},{"id":"q200","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"},{"id":"q201","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"}]},{"id":"q198","chapter":"定语从句","page":20,"ref":"关系代词·4","q":"Pass me the book ___ cover is red.","a":"whose","why":"book 的封面，whose 可指物，不只指人。","state":"待做","tag":"所属关系","note":"","task":"填写合适的关系词或关系词短语。","explanation":["从句谈的是书的封面，cover已作is的主语，需要补“这本书的”这个所属关系。","whose可修饰人的名词，也可修饰物的名词，whose cover就是“它的封面”。不能因book不是人就排除whose。"],"related":[{"id":"q197","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"},{"id":"q200","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"},{"id":"q201","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"}]},{"id":"q199","chapter":"定语从句","page":20,"ref":"关系代词·5","q":"She’s no longer the girl ___ she used to be before.","a":"that（也可省略）","why":"关系词在从句中作 be 的表语；学校考查习惯用 that，不是见 girl 就机械填 who。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["关系词在从句中作 be 的表语；学校考查习惯用 that，不是见 girl 就机械填 who。"],"related":[{"id":"q25","reason":"对照表语与命名补语：girl在be后表示身份，Lily说明me是谁；都不是动作承受的普通宾语。"}]},{"id":"q200","chapter":"定语从句","page":21,"ref":"所属改写","q":"Pass me the book whose cover is red.","a":"Pass me the book the cover of which is red. / Pass me the book of which the cover is red.","why":"whose cover 与 the cover of which 等义；注意 the 不能遗漏，of which 也不能直接取代 whose 而保留错误词序。","state":"待做","tag":"所属关系","note":"","task":"按本题给出的结构改写句子。","explanation":["whose cover就是the cover of the book。在定语从句中把book换成which，就得到the cover of which；也可以把of which提前放到the cover之前。","所以两种改写都保留the cover这个完整名词短语。不能只把whose换成of which而漏掉the，或把词序随意拼起来。"],"related":[{"id":"q197","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"},{"id":"q198","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"},{"id":"q201","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"}]},{"id":"q201","chapter":"定语从句","page":21,"ref":"介词＋whose","q":"The teacher in ___ class my sister is studying is a warm-hearted man.","a":"whose","why":"in whose class 整体在从句中作地点成分；whose 修饰 class，不能填 whom。","state":"待做","tag":"所属关系","note":"","task":"填写合适的关系词或关系词短语。","explanation":["先把关系还原：my sister is studying in the teacher’s class。原句已经给出in，空格只需要替代teacher’s，修饰后面的class。","因此填whose，连成in whose class。whom代表“谁”，却不能放在class前表示“谁的班”，所以in whom class不成立。"],"related":[{"id":"q197","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"},{"id":"q198","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"},{"id":"q200","reason":"同为所属关系：whose后接名词；既能指人的亲属或班级，也能指书的封面。"}]},{"id":"q202","chapter":"定语从句","page":21,"ref":"介词前置·学校","q":"The school (which / that) he once studied in is very famous. → The school ___ he once studied is very famous.","a":"in which（也可 where）","why":"介词 in 来自 study in the school；前置后用 which，不能用 that。","state":"待做","tag":"介词关系词","note":"","task":"按本题给出的结构改写句子。","explanation":["原句末尾有in：he once studied in the school。改写句末尾不再有in，所以它要么移到关系代词前成为in which，要么由关系副词where表达地点。","不能只填which而把必需的地点关系丢掉；介词已经前置时也不能写in that。"],"related":[{"id":"q203","reason":"介词＋关系代词要把短语还原：study in the school、play with the boy决定介词，前置后不能用that。"},{"id":"q210","reason":"介词＋关系代词要把短语还原：study in the school、play with the boy决定介词，前置后不能用that。"}]},{"id":"q203","chapter":"定语从句","page":21,"ref":"介词前置·男孩","q":"This is the boy (whom / who / that) I played tennis with yesterday. → This is the boy ___ I played tennis yesterday.","a":"with whom","why":"play tennis with sb；介词前置后，人用 whom，不能用 that。","state":"待做","tag":"介词关系词","note":"","task":"按本题给出的结构改写句子。","explanation":["还原为I played tennis with the boy yesterday，可以看出介词来自play tennis with sb这个搭配。","改写后with放在关系词前，人作介词宾语用whom，所以填with whom。with that不成立；原来介词留在句尾时能用who/that，不代表前置后也能照用。"],"related":[{"id":"q202","reason":"介词＋关系代词要把短语还原：study in the school、play with the boy决定介词，前置后不能用that。"},{"id":"q210","reason":"介词＋关系代词要把短语还原：study in the school、play with the boy决定介词，前置后不能用that。"}]},{"id":"q204","chapter":"定语从句","page":21,"ref":"部分关系·1","q":"He loves his parents deeply, ___ (他们俩) are very kind to him.","a":"both of whom","why":"先行词 parents 指人，二者用 both；逗号后的非限制性从句不可以用 that。","state":"待做","tag":"介词关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["逗号后要表达“父母二人都对他很好”。parents指人，二人都用both；放进定语从句就是both of whom。","both of them本身会形成一个独立句，不能只靠原题这个逗号与前句拼接。如果另加and可构成并列句，但那不是本题的关系词填写方式。"],"related":[{"id":"q205","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"},{"id":"q206","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"},{"id":"q207","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"}]},{"id":"q205","chapter":"定语从句","page":21,"ref":"部分关系·2","q":"In the basket there are quite many apples, ___ (有些) have gone bad.","a":"some of which","why":"apples 指物；“其中一些”用 some of which，不用 some of them 直接逗号连接独立分句。","state":"待做","tag":"介词关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["some表示有些，which指前面的apples；some of which合起来是“其中有些苹果”，作have gone bad的主语。","不能填some of them直接保留逗号连接，因为them不能把后面变成定语从句。这里不是人，也不用whom。"],"related":[{"id":"q204","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"},{"id":"q206","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"},{"id":"q207","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"}]},{"id":"q206","chapter":"定语从句","page":21,"ref":"部分关系·3","q":"There are forty students in our class in all, ___ (大多数) are from big cities.","a":"most of whom","why":"students 指人，most of whom 作从句主语。","state":"待做","tag":"介词关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["forty students是被说明的整体，逗号后说其中大多数来自大城市。most表达大多数，人用whom，得到most of whom。","这一整个短语作are的主语。不是只用whom表示“大多数”，也不能用which指这里的学生。"],"related":[{"id":"q204","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"},{"id":"q205","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"},{"id":"q207","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"}]},{"id":"q207","chapter":"定语从句","page":21,"ref":"部分关系·4","q":"Up to now, he has written ten stories, ___ (其中3篇) are about country life.","a":"three of which","why":"stories 指物；three of which 作从句主语。","state":"待做","tag":"介词关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["先明确其中三篇指的是ten stories里的三篇，而不是作者本人。数量three后加of which，把这些故事与从句连接起来。","three of which整体作are的主语。虽然前句主语he是人，关系词仍由真正被说明的stories决定，用which而不是whom。"],"related":[{"id":"q204","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"},{"id":"q205","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"},{"id":"q206","reason":"同为其中若干：数量词＋of whom（人）/which（物）。逗号后是定语从句，不直接用them拼接。"}]},{"id":"q209","chapter":"定语从句","page":21,"ref":"关系副词对比·1","q":"This is the school ___ I like best.","a":"which / that / 省略","why":"I like 缺宾语；school 表地点也不能填 where。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["把school放回从句：I like the school best，school是like的宾语。所以关系词需要代替宾语，用which或that，也可省略。","不能因为school是地点就填where；where只能说明“在哪里喜欢”，不能补上like所缺的“喜欢什么”。"],"related":[{"id":"q210","reason":"同一个school，like缺宾语用which/that；study缺地点用where/in which。先行词相同，答案仍不同。"},{"id":"q195","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"},{"id":"q196","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"}]},{"id":"q210","chapter":"定语从句","page":21,"ref":"关系副词对比·2","q":"This is the school ___ I study now.","a":"where / in which","why":"I study 主谓已完整，缺“在哪里”的地点状语。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["I study now已经有主语I和动词study，不缺动作对象；school在这里补充“在哪里学习”。","因此用where，或把study in the school的in保留成in which。和上一题I like不同，study在这里可以不带直接宾语。"],"related":[{"id":"q209","reason":"同一个school，like缺宾语用which/that；study缺地点用where/in which。先行词相同，答案仍不同。"},{"id":"q202","reason":"介词＋关系代词要把短语还原：study in the school、play with the boy决定介词，前置后不能用that。"},{"id":"q203","reason":"介词＋关系代词要把短语还原：study in the school、play with the boy决定介词，前置后不能用that。"}]},{"id":"q211","chapter":"定语从句","page":21,"ref":"关系副词对比·3","q":"Sept. 1st was the day ___ left me a deep impression.","a":"which / that","why":"left 前缺主语；不能因为 day 是时间名词就填 when。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["先看缺口：___ left me a deep impression中，left前面没有主语。“那一天给我留下深刻印象”，是day本身在从句里作主语。","因此填which/that，而不是只表示时间的when。不能仅凭先行词day就套时间关系副词。"],"related":[{"id":"q212","reason":"同一个day，left前缺主语用which/that；we played together只缺时间，用when/on which。"},{"id":"q195","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"},{"id":"q196","reason":"关系词先看从句缺口：缺主语或宾语用关系代词；先行词是地点或时间名词也不自动用where/when。"}]},{"id":"q212","chapter":"定语从句","page":21,"ref":"关系副词对比·4","q":"Sept. 1st was the day ___ we played together.","a":"when / on which","why":"we played together 结构完整，缺时间状语。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["we played together已有“我们一起玩”的完整主谓结构，the day只说明这件事发生在哪一天。","因此补时间状语，用when；还原为we played together on that day，也可以用on which。与上一题缺主语不同。"],"related":[{"id":"q211","reason":"同一个day，left前缺主语用which/that；we played together只缺时间，用when/on which。"}]},{"id":"q213","chapter":"定语从句","page":21,"ref":"关系副词对比·5","q":"Is this the reason ___ he told you?","a":"which / that / 省略","why":"he told you 后缺“告诉你的内容”，reason 作宾语。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["还原为he told you the reason：他告诉你这个原因。you是接收信息的人，reason是告诉的内容，在从句里作宾语。","所以用which/that，或省略宾语关系词。why表示为什么，不能替代这里tell所缺的具体内容。"],"related":[{"id":"q214","reason":"同一个reason，tell缺告诉的内容用which/that；be late缺原因用why/for which。"}]},{"id":"q214","chapter":"定语从句","page":21,"ref":"关系副词对比·6","q":"Is this the reason ___ he was late for class?","a":"why / for which","why":"he was late 已有主语和表语，缺原因状语。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["he was late for class已经说明“他上课迟到了”，主语、系动词和表语齐全。reason补充的是迟到的原因，不是一个缺少的宾语。","因此填why，或for which。前一道he told you需要内容宾语，本题需要原因状语，先行词一样也不能填一样的词。"],"related":[{"id":"q213","reason":"同一个reason，tell缺告诉的内容用which/that；be late缺原因用why/for which。"}]},{"id":"q215","chapter":"定语从句","page":21,"ref":"抽象地点·1","q":"Sometimes you will find yourself in a situation ___ you felt very embarrassed.","a":"where / in which","why":"situation 作为抽象情境；从句不缺主语、宾语，缺在这种情境中的状语。原句 will find 与 felt 的时态衔接欠自然，不作仿写范例。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["situation 作为抽象情境；从句不缺主语、宾语，缺在这种情境中的状语。","原句 will find 与 felt 的时态衔接欠自然，不作仿写范例。"],"related":[{"id":"q216","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"},{"id":"q217","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"},{"id":"q220","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"}]},{"id":"q216","chapter":"定语从句","page":21,"ref":"抽象地点·2","q":"He has reached a point ___ nobody can compare with him.","a":"where / at which","why":"point 表程度或阶段，从句主干完整，补阶段状语。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["point 表程度或阶段，从句主干完整，补阶段状语。"],"related":[{"id":"q215","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"},{"id":"q217","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"},{"id":"q220","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"}]},{"id":"q217","chapter":"定语从句","page":21,"ref":"occasion·3","q":"Occasions ___ I have the time to spend a day with my kids are quite rare.","a":"when / on which","why":"这里 occasions 指能陪孩子的“时候”，不是实体地点。","state":"待做","tag":"关系词","note":"","task":"填写合适的关系词或关系词短语。","explanation":["本句说能腾出一天陪孩子的“时候”很少。I have the time to spend…主干已经完整，occasion在这里承担时间意义。","因此用when或on which。occasion在别的语境可指场合，但不能因为教材把抽象名词列成一类，就机械全用where。"],"related":[{"id":"q215","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"},{"id":"q216","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"},{"id":"q220","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"}]},{"id":"q218","chapter":"定语从句","page":22,"ref":"非限制性·1","q":"His mother, ___ loves him very much, is strict with him.","a":"who","why":"指人，在从句中作主语；逗号隔开的非限制性从句不能用 that，也不能省略。","state":"待做","tag":"非限制性","note":"","task":"填写合适的关系词或关系词短语。","explanation":["who loves him very much是在两个逗号间补充母亲的情况，删去后主句His mother is strict with him仍成立。","从句loves前缺主语，先行词mother指人，所以用who。非限制性从句不能用that，这里的主语关系词也不能省略。"],"related":[{"id":"q219","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"},{"id":"q220","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"},{"id":"q221","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"}]},{"id":"q219","chapter":"定语从句","page":22,"ref":"非限制性·2","q":"China, ___ was founded in 1949, is becoming more and more powerful.","a":"which","why":"原题 China 指1949年成立的中华人民共和国；非限制性从句缺主语，指国家用 which。不是用 where。","state":"待做","tag":"非限制性","note":"历史表述可更精确为 the People’s Republic of China。","task":"填写合适的关系词或关系词短语。","explanation":["逗号后的___ was founded缺主语，需要由which代替China进入从句。这里不是在说某事“发生在中国哪里”，所以不填where。","这也是非限制性从句，不能用that。原题China在此指1949年成立的中华人民共和国，按原题措辞分析即可。"],"related":[{"id":"q218","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"},{"id":"q220","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"},{"id":"q221","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"}]},{"id":"q220","chapter":"定语从句","page":22,"ref":"非限制性·3","q":"Last summer I visited the People’s Great Hall, ___ many important meetings are held every year.","a":"where / in which","why":"从句 many important meetings are held 主谓完整，缺地点状语。","state":"待做","tag":"非限制性","note":"","task":"填写合适的关系词或关系词短语。","explanation":["many important meetings are held every year主干已经完整：很多重要会议每年举行。大会堂在从句里补充的是会议举行的地点。","因此用where或in which，不能只用which；裸which无法表达in the hall的地点关系，也不需要再为已有主语meetings补一个主语。"],"related":[{"id":"q215","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"},{"id":"q216","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"},{"id":"q217","reason":"从句主干完整后再补状语：情境、阶段可用where；陪伴孩子的occasion在这里指时候，用when。"}]},{"id":"q221","chapter":"定语从句","page":22,"ref":"整句指代·1","q":"He didn’t pass the exam, ___ surprised us.","a":"which","why":"which 指“他没通过考试”这整件事；在从句中作主语。","state":"待做","tag":"非限制性","note":"","task":"填写合适的关系词或关系词短语。","explanation":["surprised us前面缺主语。让我们吃惊的不是exam这个物品，而是“他没有通过考试”这一整件事。","which可以指代前面整个分句，并作后面从句的主语，所以填which。这里不能因exam是名词就只按修饰exam去理解。"],"related":[{"id":"q218","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"},{"id":"q219","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"},{"id":"q220","reason":"非限制性从句对照：先看指人、物、地点还是整件事，再看成分；逗号隔开不意味着一律填which。"}]},{"id":"q222","chapter":"定语从句","page":22,"ref":"整句指代·2","q":"___ we all know, Charles Dickens is considered to be a great English writer.","a":"As","why":"As we all const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records={},storageOK=true,onlyFlagged=false,current=byId.has(location.hash.slice(1))?location.hash.slice(1):DATA[0].id,filtered=[],timer;
function valid(x){return x&&typeof x==='object'&&!Array.isArray(x)&&typeof(x.note??'')==='string'&&['','flagged','learned'].includes(x.mark||'');}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))for(const[k,v]of Object.entries(saved))if(/^q\d+$/.test(k)&&valid(v))records[k]=v;}catch{storageOK=false;}
function status(){$('storageStatus').textContent=storageOK?'本机保存可用；“已理解”是自我标记，不是测试成绩。':'本机保存不可用，请导出记录备份。';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));storageOK=true;}catch{storageOK=false;}status();}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2200);}
const short=q=>`P${q.page} · ${q.ref}`;
const paragraphs=q=>q.explanation.map(p=>`<p>${esc(p)}</p>`).join('');
function relatedHTML(q){return `<section class="related"><h3>本卷相关题目</h3>${q.related.length?q.related.map(r=>{const x=byId.get(r.id);return `<details data-related="${x.id}"><summary>${esc(short(x))} · 展开讲解<span class="question" style="display:block;font-weight:400">${esc(x.q)}</span><span class="reason" style="display:block;font-weight:400">${esc(r.reason)}</span></summary><div class="body"><p class="task">${esc(x.task)}</p><h3>参考答案</h3><p class="answer">${esc(x.a)}</p><div class="explanation">${paragraphs(x)}</div><button data-jump="${x.id}">打开本题，查看作答说明与笔记 →</button></div></details>`;}).join(''):'<p class="notice">本卷中暂未选出足够直接的对照题，不为凑数量硬关联。</p>'}</section>`;}
function mainHTML(q,withRecord=true){const r=records[q.id]||{};return `<article data-current="${q.id}"><div class="toolbar"><span class="kicker">${esc(short(q))}</span><span class="badge">${esc(q.state)}</span></div><h2>${esc(q.ref)}</h2><p class="task">${esc(q.task)}</p><div class="question">${esc(q.q)}</div><h3>参考答案</h3><p class="answer">${esc(q.a)}</p><h3>这一题为什么这样做</h3><div class="explanation">${paragraphs(q)}</div>${q.note?`<div class="observation"><strong>原作答与订正说明</strong><p>${esc(q.note)}</p></div>`:q.state==='待做'?'<p class="notice">原图未见作答。本题提供参考讲解，不作为已发生错误。</p>':''}${relatedHTML(q)}${withRecord?`<section class="record"><label for="note">我的一句话理解（可选）</label><textarea id="note" placeholder="写下本题让我改变判断的那个依据。">${esc(r.note||'')}</textarea><div class="toolbar"><button data-mark="learned" aria-pressed="${r.mark==='learned'}">已理解</button><button data-mark="flagged" aria-pressed="${r.mark==='flagged'}">仍不确定</button></div><p class="notice">笔记与标记仅在本机保存，不要求先写笔记才能看讲解。</p></section>`:''}</article>`;}
function render(){const q=byId.get(current);$('reader').innerHTML=q?mainHTML(q):'<div class="panel empty">没有匹配题目，可以清空筛选再找。</div>';const index=filtered.findIndex(x=>x.id===current);$('prev').disabled=index<=0;$('next').disabled=index<0||index===filtered.length-1;$('position').textContent=index<0?'':`${index+1} / ${filtered.length}`;$('questionSelect').value=current||'';if(q)try{history.replaceState(null,'','#'+q.id);}catch{} }
function filter(){const term=$('search').value.trim().toLowerCase(),page=$('pageFilter').value;filtered=DATA.filter(q=>(page==='all'||q.page===Number(page))&&(!term||[q.ref,q.q,q.a,q.tag].join(' ').toLowerCase().includes(term))&&(!onlyFlagged||records[q.id]?.mark==='flagged'));$('count').textContent=`${filtered.length} 条练习`;$('questionSelect').innerHTML=filtered.map(q=>`<option value="${q.id}">${esc(short(q)+' · '+q.q.slice(0,75))}</option>`).join('');if(!filtered.some(q=>q.id===current))current=filtered[0]?.id||'';render();}
function jump(id){if(!byId.has(id))return;$('pageFilter').value='all';$('search').value='';onlyFlagged=false;$('flagFilter').setAttribute('aria-pressed','false');current=id;filter();$('reader').scrollIntoView({behavior:'smooth',block:'start'});}
for(const p of [...new Set(DATA.map(q=>q.page))]){const o=document.createElement('option');o.value=p;o.textContent='第'+p+'页';$('pageFilter').append(o);}
$('pageFilter').onchange=filter;$('search').oninput=filter;$('questionSelect').onchange=e=>{current=e.target.value;render();};$('clear').onclick=()=>{$('pageFilter').value='all';$('search').value='';onlyFlagged=false;$('flagFilter').setAttribute('aria-pressed','false');filter();};$('flagFilter').onclick=()=>{onlyFlagged=!onlyFlagged;$('flagFilter').setAttribute('aria-pressed',String(onlyFlagged));filter();};
for(const [name,delta]of [['prev',-1],['next',1]])$(name).onclick=()=>{const i=filtered.findIndex(q=>q.id===current),q=filtered[i+delta];if(q){current=q.id;render();$('reader').scrollIntoView({behavior:'smooth'});}};
$('reader').addEventListener('input',e=>{if(e.target.id==='note'&&current){records[current]={...(records[current]||{}),note:e.target.value};save();}});
$('reader').addEventListener('click',e=>{const link=e.target.closest('[data-jump]');if(link){jump(link.dataset.jump);return;}const b=e.target.closest('[data-mark]');if(b&&current){const r=records[current]||{};r.mark=r.mark===b.dataset.mark?'':b.dataset.mark;records[current]=r;save();if(onlyFlagged)filter();else render();}});
function download(){const data={version:1,source:'qingxu-grammar-20260922',exportedAt:new Date().toISOString(),records};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='清许语法-理解记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=download;$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('文件过大');const data=JSON.parse(await file.text()),incoming=data.records;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw Error('记录格式不正确');const accepted=Object.entries(incoming).filter(([k,v])=>/^q\d+$/.test(k)&&valid(v));if(!accepted.length)throw Error('没有可导入记录');if(!confirm('合并记录；同题已有本机笔记或标记时保留本机内容。是否继续？'))return;for(const[k,v]of accepted)if(!records[k]?.note&&!records[k]?.mark)records[k]=v;save();filter();toast('记录已合并；现有本机内容保留。');}catch(err){toast('导入未完成：'+err.message);}e.target.value='';};
$('print').onclick=()=>window.print();$('printAll').onclick=()=>{if(!filtered.length)return;$('printroot').innerHTML=filtered.map(q=>`<section class="print-item"><h2>${esc(short(q))}</h2><p>${esc(q.task)}</p><div class="question">${esc(q.q)}</div><h3>参考答案</h3><p class="answer">${esc(q.a)}</p><div class="explanation">${paragraphs(q)}</div><p>本卷对照：${q.related.map(r=>esc(short(byId.get(r.id)))).join('；')||'暂无直接关联'}</p></section>`).join('');document.body.classList.add('print-all');window.print();};window.addEventListener('afterprint',()=>{document.body.classList.remove('print-all');$('printroot').replaceChildren();});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id)&&id!==current)jump(id);});
status();filter();
</script><script defer src="/shared/nav.js"></script></body></html>
