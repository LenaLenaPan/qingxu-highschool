<!doctype html>
<html lang="zh-CN" data-answer-storage="local"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>英语语法 · 原题讲解与本卷对照</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#21364b;background:#f4f7fb;font-size:16px;line-height:1.8}*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:32px 24px 72px}h1{font-size:clamp(25px,4vw,36px);line-height:1.4;margin:6px 0 12px}h2{font-size:22px;line-height:1.5;margin:0 0 14px}h3{font-size:17px;margin:24px 0 8px}p{margin:10px 0}.muted,small{color:#607386}.kicker{font-size:13px;color:#315f98;letter-spacing:.1em}a{color:#285b99}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{padding:8px 14px;min-height:44px;border:1px solid #bccbde;border-radius:8px;color:#285b99;background:#fff}button.primary,button[aria-pressed="true"]{background:#315f98;color:white;border-color:#315f98}button:disabled{opacity:.4;cursor:default}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #e2a631;outline-offset:3px}.panel,article{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:24px;margin:20px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.controls label{display:block;font-size:14px}.controls select,.controls input{width:100%;padding:10px;background:white;border:1px solid #bdccdc;border-radius:7px}.wide{grid-column:1/-1}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0}.question{font:21px/1.9 Georgia,"Times New Roman",serif;color:#172f48;white-space:pre-wrap;background:#f5f8fc;border-left:4px solid #7796bb;padding:18px 20px;overflow-wrap:anywhere}.task{font-size:14px;color:#596f85}.answer{font-size:19px;font-weight:650;color:#244f83;overflow-wrap:anywhere}.explanation p{margin:14px 0}.observation{background:#fff8e9;border-left:3px solid #c39444;padding:12px 16px;font-size:14px}.badge{font-size:12px;border-radius:4px;background:#edf3f9;padding:4px 9px;color:#4c6681}.related{border-top:1px solid #dae4ee;padding-top:10px;margin-top:28px}.related details{border:1px solid #dce5ef;border-radius:9px;margin:14px 0;padding:15px 18px}.related summary{cursor:pointer;font-weight:650}.related .question{font-size:18px;margin:12px 0;padding:12px 14px}.related .reason{font-size:14px;color:#58718b}.related .explanation{border-top:1px dashed #ccd8e5;margin-top:10px;padding-top:4px}.related .body{margin-top:12px}.record{border-top:1px solid #dae4ee;margin-top:28px;padding-top:16px}.record textarea{width:100%;min-height:86px;padding:12px;border:1px solid #bdccdc;border-radius:8px;resize:vertical;background:#fff}.record label{display:block;font-size:14px}.position{font-size:14px;color:#607386}.notice{font-size:14px;color:#607386}.empty{padding:30px;text-align:center}.pager{display:flex;align-items:center;justify-content:space-between;gap:12px}details>summary{min-height:32px}footer{font-size:13px;color:#718196;margin-top:32px}.storage{margin-top:20px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#21364b;color:white;padding:10px 22px;border-radius:10px;z-index:999}#printroot{display:none}[hidden]{display:none!important}@media(max-width:640px){main{padding:18px 12px 48px}.panel,article{padding:18px 15px}.controls{grid-template-columns:1fr}.question{font-size:19px;padding:14px}.related details{padding:12px}.pager button{padding:8px 10px}.answer{font-size:18px}}@media print{body{background:white}main{padding:0;max-width:none}.panel,.record,.pager,.storage,footer,.lesson-header,#toast,#qingxu-shared-navigation{display:none!important}article{border:0;margin:0;padding:0}.related details{break-inside:avoid}.related details:not([open]) .body{display:block}button{display:none}body.print-all main{display:none}body.print-all #printroot{display:block}.print-item{break-after:page}.question{background:white;font-size:16pt}.explanation{font-size:11pt}}
</style></head><body><main>
<header class="lesson-header"><div class="kicker">清许 · 英语语法</div><h1>看懂这一题，再对照同类题</h1><p class="muted">按原卷页码找到题目。答案和理由直接放在原题下，相关题只选自同一份讲义。</p></header>
<section class="panel" aria-label="选择原题"><div class="controls">
<label>原卷页码<select id="pageFilter"><option value="all">全部练习页</option></select></label>
<label>搜索原句或题号<input id="search" type="search" placeholder="例如 A04、B02、school"></label>
<label class="wide">选择题目<select id="questionSelect"></select></label>
</div><div class="toolbar"><span id="count" class="position" aria-live="polite"></span><button id="clear">清空筛选</button><button id="flagFilter" aria-pressed="false">只看仍不确定</button></div></section>
<div id="reader"></div>
<nav class="pager" aria-label="原卷题目顺序"><button id="prev">← 上一题</button><span id="position" class="position"></span><button id="next">下一题 →</button></nav>
<details class="panel storage"><summary>我的记录与打印</summary><p class="notice">理解标记与笔记仅保存于当前浏览器，未接入云端。旧版的标记和笔记沿用；这次未展示的讲义归纳条目，其旧记录也不会被删除。</p><p id="storageStatus" role="status"></p><div class="toolbar"><button id="export">导出记录</button><button id="import">导入记录</button><input type="file" id="importFile" accept="application/json,.json" hidden><button id="print">打印本题与相关题</button><button id="printAll">打印筛选内全部题</button></div></details>
<footer>来源：本次上传的语法讲义第1—22页。练习从第6页起，讲义中合并的知识概述不再混作练习。题号沿用原卷，不以页面出现与否推算错题数。空白、字迹不清和多解题不自动计错。</footer>
</main><div id="printroot"></div><div id="toast" role="status" hidden></div>
<script>
'use strict';
const DATA=__GRAMMAR_DATA__;
const KEY='qingxu-grammar-20260922-v1';
const $=id=>document.getElementById(id),byId=new Map(DATA.map(q=>[q.id,q]));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records={},storageOK=true,onlyFlagged=false,current=byId.has(location.hash.slice(1))?location.hash.slice(1):DATA[0].id,filtered=[],timer;
function valid(x){return x&&typeof x==='object'&&!Array.isArray(x)&&typeof(x.note??'')==='string'&&['','flagged','learned'].includes(x.mark||'');}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))for(const[k,v]of Object.entries(saved))if(/^q\d+$/.test(k)&&valid(v))records[k]=v;}catch{storageOK=false;}
function status(){$('storageStatus').textContent=storageOK?'本机保存可用；“已理解”是自我标记，不是测试成绩。':'本机保存不可用，请导出记录备份。';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records));storageOK=true;}catch{storageOK=false;}status();}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2200);}
const short=q=>`P${q.page} · ${q.ref}`;
const paragraphs=q=>q.explanation.map(p=>`<p>${esc(p)}</p>`).join('');
function relatedHTML(q){return `<section class="related"><h3>本卷相关题目</h3>${q.related.length?q.related.map(r=>{const x=byId.get(r.id);return `<details data-related="${x.id}"><summary>${esc(short(x))} · 展开讲解<span class="question" style="display:block;font-weight:400">${esc(x.q)}</span><span class="reason" style="display:block;font-weight:400">${esc(r.reason)}</span></summary><div class="body"><p class="task">${esc(x.task)}</p><h3>参考答案</h3><p class="answer">${esc(x.a)}</p><div class="explanation">${paragraphs(x)}</div><button data-jump="${x.id}">打开本题，查看作答说明与笔记 →</button></div></details>`;}).join(''):'<p class="notice">本卷中暂未选出足够直接的对照题，不为凑数量硬关联。</p>'}</section>`;}
function mainHTML(q,withRecord=true){const r=records[q.id]||{};return `<article data-current="${q.id}"><div class="toolbar"><span class="kicker">${esc(short(q))}</span><span class="badge">${esc(q.state)}</span></div><h2>${esc(q.ref)}</h2><p class="task">${esc(q.task)}</p><div class="question">${esc(q.q)}</div><h3>参考答案</h3><p class="answer">${esc(q.a)}</p><h3>这一题为什么这样做</h3><div class="explanation">${paragraphs(q)}</div>${q.note?`<div class="observation"><strong>原作答与订正说明</strong><p>${esc(q.note)}</p></div>`:q.state==='待做'?'<p class="notice">原图未见作答。本题提供参考讲解，不作为已发生错误。</p>':''}${relatedHTML(q)}${withRecord?`<section class="record"><label for="note">我的一句话理解（可选）</label><textarea id="note" placeholder="写下本题让我改变判断的那个依据。">${esc(r.note||'')}</textarea><div class="toolbar"><button data-mark="learned" aria-pressed="${r.mark==='learned'}">已理解</button><button data-mark="flagged" aria-pressed="${r.mark==='flagged'}">仍不确定</button></div><p class="notice">笔记与标记仅在本机保存，不要求先写笔记才能看讲解。</p></section>`:''}</article>`;}
function render(){const q=byId.get(current);$('reader').innerHTML=q?mainHTML(q):'<div class="panel empty">没有匹配题目，可以清空筛选再找。</div>';const index=filtered.findIndex(x=>x.id===current);$('prev').disabled=index<=0;$('next').disabled=index<0||index===filtered.length-1;$('position').textContent=index<0?'':`${index+1} / ${filtered.length}`;$('questionSelect').value=current||'';if(q)try{history.replaceState(null,'','#'+q.id);}catch{} }
function filter(){const term=$('search').value.trim().toLowerCase(),page=$('pageFilter').value;filtered=DATA.filter(q=>(page==='all'||q.page===Number(page))&&(!term||[q.ref,q.q,q.a,q.tag].join(' ').toLowerCase().includes(term))&&(!onlyFlagged||records[q.id]?.mark==='flagged'));$('count').textContent=`${filtered.length} 条练习`;$('questionSelect').innerHTML=filtered.map(q=>`<option value="${q.id}">${esc(short(q)+' · '+q.q.slice(0,75))}</option>`).join('');if(!filtered.some(q=>q.id===current))current=filtered[0]?.id||'';render();}
function jump(id){if(!byId.has(id))return;$('pageFilter').value='all';$('search').value='';onlyFlagged=false;$('flagFilter').setAttribute('aria-pressed','false');current=id;filter();$('reader').scrollIntoView({behavior:'smooth',block:'start'});}
for(const p of [...new Set(DATA.map(q=>q.page))]){const o=document.createElement('option');o.value=p;o.textContent='第'+p+'页';$('pageFilter').append(o);}
$('pageFilter').onchange=filter;$('search').oninput=filter;$('questionSelect').onchange=e=>{current=e.target.value;render();};$('clear').onclick=()=>{$('pageFilter').value='all';$('search').value='';onlyFlagged=false;$('flagFilter').setAttribute('aria-pressed','false');filter();};$('flagFilter').onclick=()=>{onlyFlagged=!onlyFlagged;$('flagFilter').setAttribute('aria-pressed',String(onlyFlagged));filter();};
for(const [name,delta]of [['prev',-1],['next',1]])$(name).onclick=()=>{const i=filtered.findIndex(q=>q.id===current),q=filtered[i+delta];if(q){current=q.id;render();$('reader').scrollIntoView({behavior:'smooth'});}};
$('reader').addEventListener('input',e=>{if(e.target.id==='note'&&current){records[current]={...(records[current]||{}),note:e.target.value};save();}});
$('reader').addEventListener('click',e=>{const link=e.target.closest('[data-jump]');if(link){jump(link.dataset.jump);return;}const b=e.target.closest('[data-mark]');if(b&&current){const r=records[current]||{};r.mark=r.mark===b.dataset.mark?'':b.dataset.mark;records[current]=r;save();if(onlyFlagged)filter();else render();}});
function download(){const data={version:1,source:'qingxu-grammar-20260922',exportedAt:new Date().toISOString(),records};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='清许语法-理解记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=download;$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('文件过大');const data=JSON.parse(await file.text()),incoming=data.records;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw Error('记录格式不正确');const accepted=Object.entries(incoming).filter(([k,v])=>/^q\d+$/.test(k)&&valid(v));if(!accepted.length)throw Error('没有可导入记录');if(!confirm('合并记录；同题已有本机笔记或标记时保留本机内容。是否继续？'))return;for(const[k,v]of accepted)if(!records[k]?.note&&!records[k]?.mark)records[k]=v;save();filter();toast('记录已合并；现有本机内容保留。');}catch(err){toast('导入未完成：'+err.message);}e.target.value='';};
$('print').onclick=()=>window.print();$('printAll').onclick=()=>{if(!filtered.length)return;$('printroot').innerHTML=filtered.map(q=>`<section class="print-item"><h2>${esc(short(q))}</h2><p>${esc(q.task)}</p><div class="question">${esc(q.q)}</div><h3>参考答案</h3><p class="answer">${esc(q.a)}</p><div class="explanation">${paragraphs(q)}</div><p>本卷对照：${q.related.map(r=>esc(short(byId.get(r.id)))).join('；')||'暂无直接关联'}</p></section>`).join('');document.body.classList.add('print-all');window.print();};window.addEventListener('afterprint',()=>{document.body.classList.remove('print-all');$('printroot').replaceChildren();});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id)&&id!==current)jump(id);});
status();filter();
</script><script defer src="/shared/nav.js"></script></body></html>
